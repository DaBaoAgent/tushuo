  { t: 112.844, end: 114.325, text: "修驰道直通天下" },
  { t: 114.373, end: 115.636, text: "驰道宽五十步" },
  { t: 115.636, end: 117.53, text: "每隔三丈种一棵松树" },
  { t: 117.53, end: 119.003, text: "从咸阳修到燕齐" },
  { t: 119.051, end: 120.718, text: "他每天用秤称奏章" },
  { t: 120.718, end: 122.384, text: "批不完一石不休息" },
  { t: 122.432, end: 125.08, text: "秦法细到在路上倒灰都要受罚" },
  { t: 125.08, end: 126.506, text: "老百姓动辄得咎" },
  { t: 126.554, end: 128.768, text: "这些事后来每个王朝都做" },
  { t: 128.768, end: 131.184, text: "但第一个做的要挨最多的骂" },
  { t: 131.232, end: 132.632, text: "前二一三年焚书" },
  { t: 132.632, end: 135.832, text: "前二一二年坑杀四百六十多个方士和" },
  { t: 135.832, end: 136.232, text: "儒生" },
  { t: 136.28, end: 137.298, text: "他想要长生" },
  { t: 137.298, end: 140.354, text: "派徐福带三千童男童女出海找仙药" },
  { t: 140.402, end: 142.449, text: "方士说海上有三座仙山" },
  { t: 142.449, end: 144.291, text: "徐福一去就没了消息" },
  { t: 144.339, end: 145.411, text: "他一边求仙" },
  { t: 145.411, end: 146.912, text: "一边给自己修陵" },
  { t: 146.912, end: 148.413, text: "两件事都没耽误" },
  { t: 148.461, end: 149.993, text: "他五次巡游天下" },
  { t: 149.993, end: 151.743, text: "最后一次走到沙丘" },
  { t: 151.743, end: 152.4, text: "病死了" },
  { t: 152.4, end: 153.275, text: "四十九岁" },
  { t: 153.323, end: 155.381, text: "死前他写信给长子扶苏" },
  { t: 155.381, end: 157.027, text: "让他回咸阳办丧事" },
  { t: 157.075, end: 158.388, text: "信还没发出去" },
  { t: 158.388, end: 159.483, text: "赵高扣下了" },
  { t: 159.531, end: 161.043, text: "赵高和李斯合谋" },
  { t: 161.043, end: 161.691, text: "立胡亥" },
  { t: 161.691, end: 163.419, text: "逼扶苏和蒙恬自杀" },
  { t: 163.467, end: 164.347, text: "胡亥即位" },
  { t: 164.347, end: 165.227, text: "赵高掌权" },
  { t: 165.227, end: 166.986, text: "在朝堂上指鹿为马" },
  { t: 167.034, end: 170.034, text: "前二零九年陈胜吴广在大泽乡起义" },
  { t: 170.034, end: 172.034, text: "喊出王侯将相宁有种乎" },
  { t: 172.082, end: 173.957, text: "六国旧贵族跟着起兵" },
  { t: 173.957, end: 175.832, text: "项羽在巨鹿破釜沉舟" },
  { t: 175.832, end: 177.082, text: "打垮秦军主力" },
  { t: 177.13, end: 179.608, text: "秦军主力一支在北边防匈奴" },
  { t: 179.608, end: 181.261, text: "一支在南边守岭南" },
  { t: 181.261, end: 182.5, text: "关中反而空虚" },
  { t: 182.548, end: 184.747, text: "前二零七年刘邦进咸阳" },
  { t: 184.747, end: 185.627, text: "子婴投降" },
  { t: 185.627, end: 186.067, text: "秦亡" },
  { t: 186.115, end: 187.473, text: "从统一到灭亡" },
  { t: 187.473, end: 188.152, text: "十五年" },
  { t: 188.2, end: 189.042, text: "秦亡得快" },
  { t: 189.042, end: 191.146, text: "不是因为它什么都没做" },
  { t: 191.146, end: 192.83, text: "而是因为做得太绝" },
  { t: 192.878, end: 196.118, text: "修长城修驰道修阿房宫修骊山陵" },
  { t: 196.118, end: 197.507, text: "每一件都要人" },
  { t: 197.555, end: 199.407, text: "骊山陵修了三十多年" },
  { t: 199.407, end: 201.259, text: "前后征发七十多万人" },
  { t: 201.307, end: 203.365, text: "陵里用水银做江河湖海" },
  { t: 203.365, end: 205.011, text: "用兵马俑守在地下" },
  { t: 205.059, end: 206.877, text: "长城从临洮修到辽东" },
  { t: 206.877, end: 209.503, text: "把秦赵燕三家的旧墙连成一条" },
  { t: 209.551, end: 212.39, text: "这道墙后来成了中原王朝的北墙" },
  { t: 212.39, end: 213.81, text: "一代一代往下修" },
  { t: 213.858, end: 214.93, text: "更要命的是" },
  { t: 214.93, end: 216.645, text: "秦始皇没有立皇后" },
  { t: 216.645, end: 217.932, text: "也没明确太子" },
  { t: 217.98, end: 218.615, text: "他一死" },
  { t: 218.615, end: 220.943, text: "继承就成了一场宫廷政变" },
  { t: 220.991, end: 223.697, text: "秦的制度却被继承了两千年" },
  { t: 223.697, end: 225.275, text: "郡县文字度量衡" },
  { t: 225.275, end: 226.177, text: "一样没丢" },
  { t: 226.225, end: 228.076, text: "接下来上场的是刘邦" },
  { t: 228.124, end: 228.979, text: "沛县亭长" },
  { t: 228.979, end: 230.902, text: "四十多岁还在混日子" },
  { t: 230.95, end: 231.893, text: "秦末大乱" },
  { t: 231.893, end: 232.6, text: "他起兵" },
  { t: 232.6, end: 233.543, text: "先入咸阳" },
  { t: 233.591, end: 234.461, text: "进了咸阳" },
  { t: 234.461, end: 236.417, text: "他跟老百姓约法三章" },
  { t: 236.417, end: 237.287, text: "杀人者死" },
  { t: 237.287, end: 238.591, text: "伤人及盗抵罪" },
  { t: 238.639, end: 239.691, text: "项羽进了关" },
  { t: 239.691, end: 240.743, text: "摆下鸿门宴" },
  { t: 240.743, end: 243.268, text: "刘邦低头认错才捡回一条命" },
  { t: 243.316, end: 245.067, text: "后来楚汉相争四年" },
  { t: 245.067, end: 246.161, text: "萧何管后方" },
  { t: 246.161, end: 247.256, text: "张良出主意" },
  { t: 247.256, end: 248.131, text: "韩信带兵" },
  { t: 248.179, end: 250.865, text: "韩信本来在项羽手下不受重用" },
  { t: 250.865, end: 251.691, text: "跑到汉中" },
  { t: 251.691, end: 253.55, text: "萧何连夜把他追回来" },
  { t: 253.598, end: 254.876, text: "刘邦筑坛拜将" },
  { t: 254.876, end: 256.153, text: "把兵权交给他" },
  { t: 256.153, end: 257.857, text: "这才有了还定三秦" },
  { t: 257.905, end: 260.233, text: "公元前二零二年垓下之战" },
  { t: 260.233, end: 261.079, text: "四面楚歌" },
  { t: 261.079, end: 262.349, text: "项羽自刎乌江" },
  { t: 262.397, end: 263.323, text: "一个平民" },
  { t: 263.323, end: 264.249, text: "七年时间" },
  { t: 264.249, end: 265.175, text: "成了天子" },
  { t: 265.223, end: 267.27, text: "他坐上去才知道椅子烫" },
  { t: 267.27, end: 269.112, text: "异姓王一个接一个反" },
  { t: 269.16, end: 270.613, text: "韩信彭越英布" },
  { t: 270.613, end: 272.308, text: "最后都被他除掉" },
  { t: 272.356, end: 274.587, text: "公元前二零零年亲征匈奴" },
  { t: 274.587, end: 276.615, text: "在白登被围了七天七夜" },
  { t: 276.663, end: 278.568, text: "靠陈平贿赂单于阏氏" },
  { t: 278.568, end: 279.626, text: "才脱身回来" },
  { t: 279.674, end: 281.773, text: "从那以后他不提打匈奴" },
  { t: 281.773, end: 282.822, text: "改成了和亲" },
  { t: 282.87, end: 284.787, text: "刘邦死前杀白马盟誓" },
  { t: 284.787, end: 286.065, text: "说非刘氏而王" },
  { t: 286.065, end: 287.13, text: "天下共击之" },
  { t: 287.178, end: 288.011, text: "刘邦死后" },
  { t: 288.011, end: 289.47, text: "吕后掌权十五年" },
  { t: 289.47, end: 292.178, text: "差点把刘家天下变成吕家天下" },
  { t: 292.226, end: 294.415, text: "老臣周勃陈平发动政变" },
  { t: 294.415, end: 295.728, text: "才把吕氏除掉" },
  { t: 295.728, end: 297.041, text: "迎回代王刘恒" },
  { t: 297.089, end: 299.644, text: "文景两代黄老无为轻徭薄赋" },
  { t: 299.644, end: 301.348, text: "老百姓终于能喘气" },
  { t: 301.396, end: 302.438, text: "到武帝初年" },
  { t: 302.438, end: 304.521, text: "国库里的钱串绳都烂了" },
  { t: 304.521, end: 306.396, text: "粮仓的谷子堆到发霉" },
  { t: 306.444, end: 308.367, text: "文帝自己穿粗布衣服" },
  { t: 308.367, end: 309.435, text: "想修个露台" },
  { t: 309.435, end: 311.572, text: "一算要花十户人家的钱" },
  { t: 311.572, end: 311.999, text: "算了" },
  { t: 312.047, end: 313.329, text: "缇萦上书救父" },
  { t: 313.329, end: 314.825, text: "文帝就废了肉刑" },
  { t: 314.873, end: 317.739, text: "景帝时公元前一五四年七国之乱" },
  { t: 317.739, end: 318.762, text: "三个月平定" },
  { t: 318.81, end: 321.958, text: "真正把汉朝推到顶点的是汉武帝刘彻" },
  { t: 322.006, end: 323.086, text: "十六岁即位" },
  { t: 323.086, end: 324.383, text: "在位五十四年" },
  { t: 324.383, end: 325.895, text: "打了四十四年仗" },
  { t: 325.943, end: 326.578, text: "推恩令" },
  { t: 326.578, end: 328.906, text: "让诸侯王的封地越分越小" },
  { t: 328.954, end: 330.732, text: "盐铁官营均输平准" },
  { t: 330.732, end: 332.287, text: "把财政抓回中央" },
  { t: 332.335, end: 333.207, text: "独尊儒术" },
  { t: 333.207, end: 333.86, text: "设太学" },
  { t: 333.86, end: 336.039, text: "给帝国一套统一的说法" },
  { t: 336.087, end: 338.066, text: "派卫青霍去病打匈奴" },
  { t: 338.066, end: 339.606, text: "把战线推到漠北" },
  { t: 339.654, end: 341.538, text: "前一一九年漠北之战" },
  { t: 341.538, end: 343.212, text: "两人各带五万骑兵" },
  { t: 343.212, end: 344.468, text: "出塞两千多里" },
  { t: 344.516, end: 345.998, text: "霍去病封狼居胥" },
  { t: 345.998, end: 347.479, text: "那年才二十出头" },
  { t: 347.527, end: 348.777, text: "张骞出使西域" },
  { t: 348.777, end: 350.235, text: "被匈奴扣了十年" },
  { t: 350.235, end: 352.527, text: "回来时一百多人只剩两个" },
  { t: 352.575, end: 354.604, text: "丝绸之路从这时候开始" },
  { t: 354.604, end: 356.835, text: "中国的丝绸一直卖到罗马" },
  { t: 356.883, end: 357.78, text: "代价也重" },
  { t: 357.78, end: 358.676, text: "连年用兵" },
  { t: 358.676, end: 359.573, text: "国库空了" },
  { t: 359.573, end: 361.142, text: "登记的户口减半" },
  { t: 361.19, end: 362.715, text: "老百姓交不起税" },
  { t: 362.715, end: 363.587, text: "流民遍地" },
  { t: 363.587, end: 364.894, text: "各地起义不断" },
  { t: 364.942, end: 366.212, text: "晚年巫蛊之祸" },
  { t: 366.212, end: 367.905, text: "太子刘据被逼自杀" },
  { t: 367.905, end: 369.386, text: "皇后卫子夫自尽" },
  { t: 369.434, end: 370.892, text: "他立幼子刘弗陵" },
  { t: 370.892, end: 373.184, text: "又杀了孩子母亲钩弋夫人" },
  { t: 373.184, end: 374.434, text: "防止太后干政" },
  { t: 374.482, end: 377.334, text: "公元前八十九年他下轮台罪己诏" },
  { t: 377.334, end: 378.556, text: "承认自己错了" },
  { t: 378.604, end: 379.744, text: "汉武帝之后" },
  { t: 379.744, end: 380.655, text: "霍光辅政" },
  { t: 380.655, end: 381.567, text: "昭宣中兴" },
  { t: 381.615, end: 382.897, text: "昭帝八岁即位" },
  { t: 382.897, end: 384.393, text: "霍光掌权二十年" },
  { t: 384.441, end: 386.196, text: "霍光废过一个只当了" },
  { t: 386.196, end: 388.145, text: "二十七天皇帝的昌邑王" },
  { t: 388.193, end: 390.901, text: "汉宣帝是从民间找回来的皇孙" },
  { t: 390.901, end: 391.526, text: "坐过牢" },
  { t: 391.526, end: 393.193, text: "知道老百姓的难处" },
  { t: 393.241, end: 395.352, text: "再往后元帝成帝哀帝" },
  { t: 395.352, end: 396.759, text: "一代不如一代" },
  { t: 396.807, end: 398.046, text: "外戚王氏掌权" },
  { t: 398.046, end: 400.525, text: "王莽装了几十年的谦谦君子" },
  { t: 400.525, end: 402.177, text: "朝野都说他是圣人" },
  { t: 402.225, end: 403.954, text: "公元八年王莽代汉" },
  { t: 403.954, end: 404.818, text: "建立新朝" },
  { t: 404.866, end: 405.825, text: "王莽改制" },
  { t: 405.825, end: 407.981, text: "改地名改币制改土地" },
  { t: 407.981, end: 408.94, text: "越改越乱" },
  { t: 408.988, end: 411.605, text: "他把全国的官名地名改了一遍" },
  { t: 411.605, end: 413.618, text: "连匈奴单于的印都换了" },
  { t: 413.666, end: 415.191, text: "十五年天下大乱" },
  { t: 415.191, end: 416.498, text: "绿林赤眉起义" },
  { t: 416.498, end: 417.369, text: "新朝灭亡" },
  { t: 417.417, end: 419.578, text: "公元二十五年刘秀称帝" },
  { t: 419.578, end: 420.442, text: "重建汉朝" },
  { t: 420.442, end: 421.306, text: "史称东汉" },
  { t: 421.354, end: 422.977, text: "他是刘邦的九世孙" },
  { t: 422.977, end: 425.614, text: "到他那辈已经是个种地的宗室" },
  { t: 425.662, end: 427.551, text: "起兵时穷得买不起马" },
  { t: 427.551, end: 428.81, text: "只能骑牛上阵" },
  { t: 428.858, end: 429.681, text: "昆阳之战" },
  { t: 429.681, end: 432.561, text: "一万多人打败王莽四十二万大军" },
  { t: 432.609, end: 435.972, text: "当皇帝后他释放奴婢度田裁并郡县" },
  { t: 435.972, end: 436.869, text: "光武中兴" },
  { t: 436.917, end: 438.173, text: "跟刘邦不一样" },
  { t: 438.173, end: 439.429, text: "他没有杀功臣" },
  { t: 439.429, end: 441.731, text: "云台二十八将都得了善终" },
  { t: 441.779, end: 443.168, text: "明帝章帝接手" },
  { t: 443.168, end: 444.094, text: "吏治清明" },
  { t: 444.094, end: 445.483, text: "史称明章之治" },
  { t: 445.531, end: 446.787, text: "窦宪北击匈奴" },
  { t: 446.787, end: 448.462, text: "在燕然山刻石记功" },
  { t: 448.462, end: 450.346, text: "那是东汉武功的顶点" },
  { t: 450.394, end: 451.895, text: "蔡伦改进造纸术" },
  { t: 451.895, end: 453.181, text: "张衡造地动仪" },
  { t: 453.181, end: 454.468, text: "都在这个朝代" },
  { t: 454.516, end: 455.829, text: "但东汉的皇帝" },
  { t: 455.829, end: 456.923, text: "整体偏年轻" },
  { t: 456.971, end: 458.305, text: "和帝十岁即位" },
  { t: 458.305, end: 459.638, text: "殇帝一百多天" },
  { t: 459.638, end: 460.527, text: "冲帝两岁" },
  { t: 460.527, end: 461.416, text: "质帝八岁" },
  { t: 461.464, end: 462.513, text: "东汉的皇帝" },
  { t: 462.513, end: 464.612, text: "很多不到三十岁就死了" },
  { t: 464.66, end: 465.367, text: "皇帝小" },
  { t: 465.367, end: 466.31, text: "太后临朝" },
  { t: 466.31, end: 467.253, text: "外戚掌权" },
  { t: 467.301, end: 468.18, text: "皇帝长大" },
  { t: 468.18, end: 469.72, text: "靠宦官除掉外戚" },
  { t: 469.72, end: 470.819, text: "宦官再掌权" },
  { t: 470.867, end: 471.935, text: "外戚和宦官" },
  { t: 471.935, end: 473.645, text: "像钟摆一样来回摆" },
  { t: 473.693, end: 475.776, text: "中间还夹着一批士大夫" },
  { t: 475.776, end: 477.651, text: "他们看不惯外戚宦官" },
  { t: 477.651, end: 478.693, text: "一次次上书" },
  { t: 478.741, end: 480.037, text: "结果就是党锢" },
  { t: 480.037, end: 481.766, text: "读书人被打成朋党" },
  { t: 481.766, end: 482.63, text: "不许做官" },
  { t: 482.678, end: 484.993, text: "梁冀当了二十年跋扈将军" },
  { t: 484.993, end: 486.886, text: "最后被宦官围在家里" },
  { t: 486.886, end: 487.307, text: "自杀" },
  { t: 487.355, end: 489.022, text: "桓帝灵帝公开卖官" },
  { t: 489.022, end: 490.689, text: "三公标价一千万钱" },
  { t: 490.737, end: 492.441, text: "一八四年黄巾起义" },
  { t: 492.441, end: 494.144, text: "张角喊出苍天已死" },
  { t: 494.144, end: 494.996, text: "黄天当立" },
  { t: 495.044, end: 497.091, text: "州郡长官趁机拥兵自重" },
  { t: 497.091, end: 498.933, text: "朝廷只好把兵权下放" },
  { t: 498.981, end: 500.759, text: "一八九年董卓进京" },
  { t: 500.759, end: 502.092, text: "废少帝立献帝" },
  { t: 502.092, end: 503.425, text: "东汉名存实亡" },
  { t: 503.473, end: 506.121, text: "一九六年曹操把献帝迎到许都" },
  { t: 506.121, end: 507.547, text: "挟天子以令诸侯" },
  { t: 507.595, end: 509.232, text: "二零零年官渡之战" },
  { t: 509.232, end: 511.484, text: "曹操两万人打垮袁绍十万" },
  { t: 511.532, end: 513.199, text: "二零八年赤壁之战" },
  { t: 513.199, end: 514.449, text: "孙刘联军五万" },
  { t: 514.449, end: 516.532, text: "一把火烧了曹操的水军" },
  { t: 516.58, end: 518.474, text: "那一年周瑜三十三岁" },
  { t: 518.474, end: 519.947, text: "诸葛亮二十七岁" },
  { t: 519.947, end: 521.21, text: "曹操五十三岁" },
  { t: 521.258, end: 524.139, text: "公元二二零年曹丕逼汉献帝禅让" },
  { t: 524.139, end: 524.962, text: "东汉结束" },
  { t: 525.01, end: 526.738, text: "曹丕称帝的第二年" },
  { t: 526.738, end: 528.251, text: "刘备在成都称帝" },
  { t: 528.251, end: 528.899, text: "国号汉" },
  { t: 528.947, end: 530.587, text: "二二一年刘备伐吴" },
  { t: 530.587, end: 533.252, text: "第二年在夷陵被陆逊火烧连营" },
  { t: 533.252, end: 534.687, text: "退到白帝城托孤" },
  { t: 534.735, end: 537.044, text: "二二九年孙权在建业称帝" },
  { t: 537.044, end: 537.883, text: "三国鼎立" },
  { t: 537.931, end: 539.848, text: "曹丕推行九品中正制" },
  { t: 539.848, end: 540.913, text: "选官看家世" },
  { t: 540.913, end: 542.191, text: "门阀从此坐大" },
  { t: 542.239, end: 543.136, text: "曹魏这边" },
  { t: 543.136, end: 546.498, text: "司马懿熬死了曹操曹丕曹叡三代人" },
  { t: 546.546, end: 548.421, text: "二四九年高平陵之变" },
  { t: 548.421, end: 549.879, text: "他装病骗过曹爽" },
  { t: 549.879, end: 551.546, text: "一夜之间夺了兵权" },
  { t: 551.594, end: 553.149, text: "二六三年魏灭蜀" },
  { t: 553.149, end: 554.038, text: "刘禅出降" },
  { t: 554.038, end: 554.927, text: "乐不思蜀" },
  { t: 554.975, end: 557.66, text: "三国的故事被演义讲了几百年" },
  { t: 557.66, end: 558.9, text: "真正的历史里" },
  { t: 558.9, end: 560.346, text: "曹操到死没称帝" },
  { t: 560.394, end: 562.616, text: "二六五年司马炎代魏建晋" },
  { t: 562.664, end: 564.16, text: "二八零年晋灭吴" },
  { t: 564.16, end: 565.442, text: "天下重新统一" },
  { t: 565.49, end: 567.342, text: "统一只维持了十一年" },
  { t: 567.39, end: 568.915, text: "司马炎大封宗室" },
  { t: 568.915, end: 570.004, text: "二十七个王" },
  { t: 570.004, end: 571.093, text: "手里都有兵" },
  { t: 571.141, end: 572.834, text: "他自己后宫上万人" },
  { t: 572.834, end: 574.104, text: "坐着羊车乱逛" },
  { t: 574.104, end: 575.586, text: "羊停在哪就住哪" },
  { t: 575.634, end: 577.115, text: "石崇和王恺斗富" },
  { t: 577.115, end: 578.597, text: "一个用蜡当柴烧" },
  { t: 578.597, end: 580.078, text: "一个用糖水刷锅" },
  { t: 580.126, end: 580.774, text: "他一死" },
  { t: 580.774, end: 582.719, text: "八王之乱打了十六年" },
  { t: 582.767, end: 584.883, text: "三一一年刘曜攻破洛阳" },
  { t: 584.883, end: 585.941, text: "晋怀帝被俘" },
  { t: 585.941, end: 587.211, text: "史称永嘉之乱" },
  { t: 587.259, end: 589.033, text: "匈奴鲜卑羯氐羌" },
  { t: 589.033, end: 590.553, text: "五胡先后建国" },
  { t: 590.553, end: 592.074, text: "北方打成一片" },
  { t: 592.122, end: 593.851, text: "三一六年长安陷落" },
  { t: 593.851, end: 594.715, text: "西晋灭亡" },
  { t: 594.763, end: 597.263, text: "三一七年司马睿在建康称帝" },
  { t: 597.263, end: 598.096, text: "东晋开始" },
  { t: 598.144, end: 599.837, text: "北方士族大批南迁" },
  { t: 599.837, end: 601.107, text: "史称衣冠南渡" },
  { t: 601.155, end: 602.425, text: "王导一手安排" },
  { t: 602.425, end: 604.33, text: "司马睿登基后开大会" },
  { t: 604.33, end: 605.811, text: "拉着他同坐御床" },
  { t: 605.811, end: 607.081, text: "王与马共天下" },
  { t: 607.129, end: 608.011, text: "祖逖北伐" },
  { t: 608.011, end: 608.892, text: "中流击楫" },
  { t: 608.892, end: 610.215, text: "收复黄河以南" },
  { t: 610.215, end: 611.758, text: "朝廷却不给后援" },
  { t: 611.806, end: 612.864, text: "东晋的皇帝" },
  { t: 612.864, end: 614.769, text: "很多是门阀扶上去的" },
  { t: 614.817, end: 617.966, text: "三八三年苻坚带号称百万的大军南下" },
  { t: 618.014, end: 618.868, text: "淝水之战" },
  { t: 618.868, end: 620.791, text: "谢玄八万人把他打垮" },
  { t: 620.839, end: 622.308, text: "苻坚败退回北方" },
  { t: 622.308, end: 623.987, text: "前秦跟着四分五裂" },
  { t: 624.035, end: 625.369, text: "北魏趁机崛起" },
  { t: 625.369, end: 626.258, text: "统一北方" },
  { t: 626.306, end: 627.936, text: "这一仗保住了江南" },
  { t: 627.936, end: 630.38, text: "也保住了汉文化的半壁江山" },
  { t: 630.428, end: 632.156, text: "四二零年刘裕代晋" },
  { t: 632.156, end: 633.02, text: "南朝开始" },
  { t: 633.068, end: 633.915, text: "宋齐梁陈" },
  { t: 633.915, end: 636.031, text: "四个朝代一百六十九年" },
  { t: 636.079, end: 637.399, text: "刘裕出身寒门" },
  { t: 637.399, end: 638.938, text: "小时候砍柴打鱼" },
  { t: 638.938, end: 639.598, text: "打仗猛" },
  { t: 639.646, end: 641.137, text: "宋文帝元嘉年间" },
  { t: 641.137, end: 642.627, text: "江南太平三十年" },
  { t: 642.627, end: 643.905, text: "史称元嘉之治" },
  { t: 643.953, end: 645.418, text: "但元嘉北伐失败" },
  { t: 645.418, end: 647.512, text: "北魏太武帝打到长江边" },
  { t: 647.512, end: 648.768, text: "史称元嘉草草" },
  { t: 648.816, end: 650.495, text: "北边北魏统一北方" },
  { t: 650.495, end: 651.964, text: "孝文帝迁都洛阳" },
  { t: 652.012, end: 654.029, text: "改汉姓穿汉服说汉话" },
  { t: 654.029, end: 656.271, text: "连皇族拓跋氏都改姓元" },
  { t: 656.319, end: 657.201, text: "迁都那年" },
  { t: 657.201, end: 658.744, text: "他骗群臣说南征" },
  { t: 658.744, end: 659.626, text: "走到洛阳" },
  { t: 659.626, end: 660.949, text: "大家不肯走了" },
  { t: 660.997, end: 662.681, text: "北魏后期六镇兵变" },
  { t: 662.681, end: 663.943, text: "尔朱荣进洛阳" },
  { t: 663.943, end: 665.627, text: "把朝臣杀了个精光" },
  { t: 665.675, end: 666.982, text: "北魏一分为二" },
  { t: 666.982, end: 667.853, text: "东魏西魏" },
  { t: 667.853, end: 669.378, text: "再变成北齐北周" },
  { t: 669.426, end: 670.475, text: "南朝的齐朝" },
  { t: 670.475, end: 672.574, text: "二十三年换了七个皇帝" },
  { t: 672.622, end: 675.351, text: "南边梁武帝萧衍在位四十八年" },
  { t: 675.351, end: 675.771, text: "信佛" },
  { t: 675.819, end: 677.277, text: "四次舍身同泰寺" },
  { t: 677.277, end: 679.152, text: "大臣凑钱把他赎回来" },
  { t: 679.2, end: 680.91, text: "五四八年侯景之乱" },
  { t: 680.91, end: 681.978, text: "建康被攻破" },
  { t: 682.026, end: 683.558, text: "萧衍饿死在台城" },
  { t: 683.558, end: 684.433, text: "八十六岁" },
  { t: 684.481, end: 685.963, text: "南朝四百八十寺" },
  { t: 685.963, end: 687.444, text: "多少楼台烟雨中" },
  { t: 687.444, end: 688.926, text: "说的就是这时候" },
  { t: 688.974, end: 690.611, text: "五八九年隋军渡江" },
  { t: 690.611, end: 692.862, text: "陈后主带着妃子躲进枯井" },
  { t: 692.91, end: 694.423, text: "被拉出来的时候" },
  { t: 694.423, end: 695.503, text: "南朝结束了" },
  { t: 695.551, end: 697.403, text: "隋朝只活了三十七年" },
  { t: 697.451, end: 699.534, text: "五八一年杨坚代周建隋" },
  { t: 699.534, end: 700.784, text: "五八九年灭陈" },
  { t: 700.832, end: 702.088, text: "他创三省六部" },
  { t: 702.088, end: 702.716, text: "开科举" },
  { t: 702.716, end: 705.647, text: "把选官的权力从门阀手里收回来" },
  { t: 705.695, end: 707.317, text: "开皇年间国库充实" },
  { t: 707.317, end: 709.954, text: "粮仓的粮食吃到唐朝还没吃完" },
  { t: 710.002, end: 711.828, text: "大运河把南北连起来" },
  { t: 711.828, end: 714.262, text: "后来的漕运靠它吃了上千年" },
  { t: 714.31, end: 715.629, text: "但他猜忌心重" },
  { t: 715.629, end: 716.948, text: "废了太子杨勇" },
  { t: 716.948, end: 717.828, text: "改立杨广" },
  { t: 717.876, end: 719.543, text: "六零四年杨广即位" },
  { t: 719.591, end: 720.69, text: "他修大运河" },
  { t: 720.69, end: 722.01, text: "从余杭到涿郡" },
  { t: 722.01, end: 723.109, text: "两千多公里" },
  { t: 723.157, end: 724.59, text: "隋炀帝设进士科" },
  { t: 724.59, end: 727.046, text: "科举从此成了读书人的正路" },
  { t: 727.094, end: 727.917, text: "三征高丽" },
  { t: 727.917, end: 730.798, text: "第一次就出动一百一十三万大军" },
  { t: 730.846, end: 732.735, text: "一支三十万人的队伍" },
  { t: 732.735, end: 733.994, text: "回来不到三千" },
  { t: 734.042, end: 734.968, text: "民力耗尽" },
  { t: 734.968, end: 735.894, text: "天下大乱" },
  { t: 735.942, end: 738.823, text: "六一八年杨广在江都被部下勒死" },
  { t: 738.823, end: 739.646, text: "隋朝灭亡" },
  { t: 739.694, end: 741.043, text: "他死前照镜子" },
  { t: 741.043, end: 741.943, text: "说好头颅" },
  { t: 741.943, end: 742.842, text: "谁当斫之" },
  { t: 742.89, end: 745.199, text: "六一八年李渊在长安称帝" },
  { t: 745.199, end: 746.038, text: "唐朝开始" },
  { t: 746.086, end: 747.886, text: "六二六年玄武门之变" },
  { t: 747.886, end: 751.086, text: "李世民杀了哥哥李建成和弟弟李元吉" },
  { t: 751.134, end: 752.599, text: "他在玄武门埋伏" },
  { t: 752.599, end: 754.065, text: "一箭射死李建成" },
  { t: 754.065, end: 755.949, text: "尉迟敬德杀了李元吉" },
  { t: 755.997, end: 757.275, text: "他逼父亲退位" },
  { t: 757.275, end: 759.404, text: "自己当了二十三年皇帝" },
  { t: 759.404, end: 760.256, text: "年号贞观" },
  { t: 760.304, end: 761.637, text: "纳谏轻徭用人" },
  { t: 761.637, end: 764.748, text: "魏征死了他说自己少了一面镜子" },
  { t: 764.796, end: 765.615, text: "贞观之治" },
  { t: 765.615, end: 768.685, text: "人口从两百万户恢复到三百多万户" },
  { t: 768.733, end: 771.881, text: "有一年全国判死刑的只有二十九个人" },
  { t: 771.929, end: 774.059, text: "周边各族尊他为天可汗" },
  { t: 774.059, end: 774.911, text: "玄奘西行" },
  { t: 774.911, end: 776.189, text: "文成公主入藏" },
  { t: 776.237, end: 778.126, text: "六四九年李世民去世" },
  { t: 778.126, end: 779.385, text: "儿子李治即位" },
  { t: 779.433, end: 781.35, text: "皇后武则天慢慢掌权" },
  { t: 781.35, end: 782.627, text: "六九零年称帝" },
  { t: 782.627, end: 783.692, text: "改国号为周" },
  { t: 783.74, end: 786.333, text: "她是中国历史上唯一的女皇帝" },
  { t: 786.381, end: 787.625, text: "她十四岁进宫" },
  { t: 787.625, end: 789.077, text: "从才人做到皇后" },
  { t: 789.077, end: 791.566, text: "又在皇后位上等了三十五年" },
  { t: 791.614, end: 794.762, text: "十五年里她把唐朝宗室杀得七零八落" },
  { t: 794.81, end: 796.868, text: "也把科举取士推得更广" },
  { t: 796.868, end: 798.514, text: "寒门子弟有了出路" },
  { t: 798.562, end: 799.604, text: "她重用酷吏" },
  { t: 799.604, end: 801.895, text: "也重用狄仁杰这样的能臣" },
  { t: 801.943, end: 803.686, text: "七零五年神龙政变" },
  { t: 803.686, end: 804.775, text: "武则天退位" },
  { t: 804.775, end: 805.647, text: "唐朝复辟" },
  { t: 805.695, end: 807.354, text: "她那年冬天就死了" },
  { t: 807.354, end: 808.184, text: "八十二岁" },
  { t: 808.184, end: 810.88, text: "乾陵前那块无字碑一个字没刻" },
  { t: 810.928, end: 813.44, text: "之后韦后太平公主先后弄权" },
  { t: 813.44, end: 815.743, text: "直到七一二年李隆基即位" },
  { t: 815.791, end: 818.235, text: "七一三到七四一年开元盛世" },
  { t: 818.235, end: 819.865, text: "全国人口约八千万" },
  { t: 819.913, end: 822.55, text: "长安是当时世界上最大的城市" },
  { t: 822.55, end: 824.172, text: "西市里到处是胡商" },
  { t: 824.22, end: 825.673, text: "李白杜甫王维" },
  { t: 825.673, end: 827.368, text: "都活在这个年代" },
  { t: 827.416, end: 829.657, text: "开元年间米价一斗十几文" },
  { t: 829.657, end: 831.49, text: "路上掉了东西没人捡" },
  { t: 831.538, end: 833.205, text: "但盛世底下埋着雷" },
  { t: 833.253, end: 834.411, text: "府兵制瓦解" },
  { t: 834.411, end: 835.105, text: "改募兵" },
  { t: 835.153, end: 837.047, text: "节度使权力越来越大" },
  { t: 837.047, end: 838.52, text: "边疆十大节度使" },
  { t: 838.52, end: 839.782, text: "兵力四十九万" },
  { t: 839.83, end: 843.358, text: "安禄山一个人就管着范阳平卢河东三" },
  { t: 843.358, end: 843.578, text: "镇" },
  { t: 843.578, end: 844.46, text: "十八万兵" },
  { t: 844.508, end: 846.977, text: "七五五年安禄山在范阳起兵" },
  { t: 846.977, end: 848.212, text: "安史之乱爆发" },
  { t: 848.26, end: 849.609, text: "叛军一路南下" },
  { t: 849.609, end: 851.408, text: "洛阳长安先后失守" },
  { t: 851.456, end: 852.968, text: "玄宗逃到马嵬坡" },
  { t: 852.968, end: 853.833, text: "禁军哗变" },
  { t: 853.833, end: 855.345, text: "他赐死了杨贵妃" },
  { t: 855.393, end: 857.31, text: "太子李亨在灵武即位" },
  { t: 857.31, end: 859.652, text: "靠郭子仪李光弼苦苦支撑" },
  { t: 859.7, end: 861.747, text: "安禄山后来被儿子杀掉" },
  { t: 861.747, end: 863.589, text: "史思明又被儿子杀掉" },
  { t: 863.637, end: 865.303, text: "八年之后叛乱平定" },
  { t: 865.303, end: 866.97, text: "唐朝再也回不去了" },
  { t: 867.018, end: 868.06, text: "安史之乱后" },
  { t: 868.06, end: 870.352, text: "登记的户口只剩三分之一" },
  { t: 870.4, end: 872.745, text: "藩镇割据宦官专权党争" },
  { t: 872.745, end: 873.918, text: "一个接一个" },
  { t: 873.966, end: 875.439, text: "皇帝由宦官拥立" },
  { t: 875.439, end: 877.333, text: "有的皇帝想除掉宦官" },
  { t: 877.333, end: 878.596, text: "反被宦官杀掉" },
  { t: 878.644, end: 880.3, text: "八三五年甘露之变" },
  { t: 880.3, end: 882.162, text: "宦官杀了几百名朝臣" },
  { t: 882.21, end: 883.903, text: "八七五年黄巢起义" },
  { t: 883.903, end: 885.173, text: "八八四年失败" },
  { t: 885.221, end: 887.53, text: "九零七年朱温废掉唐哀帝" },
  { t: 887.53, end: 888.369, text: "唐朝灭亡" },
  { t: 888.417, end: 890.121, text: "九零七到九六零年" },
  { t: 890.121, end: 890.973, text: "五十三年" },
  { t: 890.973, end: 892.677, text: "中原换了五个朝代" },
  { t: 892.725, end: 893.814, text: "十四个皇帝" },
  { t: 893.814, end: 894.468, text: "八个姓" },
  { t: 894.468, end: 896.428, text: "谁兵强马壮谁当皇帝" },
  { t: 896.476, end: 897.958, text: "五代的宰相冯道" },
  { t: 897.958, end: 899.863, text: "前后伺候过十个皇帝" },
  { t: 899.863, end: 900.921, text: "自称长乐老" },
  { t: 900.969, end: 902.636, text: "李存勖灭梁建后唐" },
  { t: 902.636, end: 903.886, text: "打了十五年仗" },
  { t: 903.886, end: 905.969, text: "当皇帝三年就死于兵变" },
  { t: 906.017, end: 908.5, text: "石敬瑭割燕云十六州给契丹" },
  { t: 908.5, end: 909.535, text: "当了儿皇帝" },
  { t: 909.583, end: 910.618, text: "这片地一丢" },
  { t: 910.618, end: 913.102, text: "中原的北大门四百年没关上" },
  { t: 913.15, end: 914.909, text: "九五四年柴荣即位" },
  { t: 914.909, end: 916.668, text: "整顿军队清查田亩" },
  { t: 916.716, end: 917.766, text: "他北伐辽国" },
  { t: 917.766, end: 919.865, text: "四十二天收复三关三州" },
  { t: 919.913, end: 920.607, text: "柴荣说" },
  { t: 920.607, end: 921.765, text: "给他三十年" },
  { t: 921.765, end: 922.69, text: "十年开拓" },
  { t: 922.69, end: 923.616, text: "十年养民" },
  { t: 923.616, end: 924.542, text: "十年太平" },
  { t: 924.59, end: 926.145, text: "他才做了五年半" },
  { t: 926.145, end: 927.034, text: "就病死了" },
  { t: 927.034, end: 927.923, text: "三十九岁" },
  { t: 927.971, end: 928.612, text: "十国里" },
  { t: 928.612, end: 929.894, text: "南唐李煜写词" },
  { t: 929.894, end: 931.39, text: "后蜀孟昶修宫殿" },
  { t: 931.39, end: 933.527, text: "都是乱世里的一点斯文" },
  { t: 933.575, end: 935.254, text: "九五九年柴荣病逝" },
  { t: 935.254, end: 936.723, text: "七岁的儿子即位" },
  { t: 936.771, end: 939.13, text: "九六零年赵匡胤陈桥兵变" },
  { t: 939.13, end: 939.987, text: "黄袍加身" },
  { t: 939.987, end: 940.845, text: "建立宋朝" },
  { t: 940.893, end: 942.163, text: "赵匡胤当皇帝" },
  { t: 942.163, end: 943.856, text: "第一件事是收兵权" },
  { t: 943.904, end: 945.746, text: "九六一年杯酒释兵权" },
  { t: 945.746, end: 947.793, text: "将领交出兵权回家养老" },
  { t: 947.841, end: 948.981, text: "他定下规矩" },
  { t: 948.981, end: 950.804, text: "重文抑武强干弱枝" },
  { t: 950.852, end: 952.13, text: "兵权归枢密院" },
  { t: 952.13, end: 953.194, text: "统兵归三衙" },
  { t: 953.194, end: 955.111, text: "调兵和统兵分成两套" },
  { t: 955.159, end: 956.863, text: "地方精锐编入禁军" },
  { t: 956.863, end: 957.715, text: "轮番戍边" },
  { t: 957.715, end: 959.419, text: "将领带的是陌生兵" },
  { t: 959.467, end: 961.133, text: "科举取士人数大增" },
  { t: 961.133, end: 962.8, text: "文官地位高过武将" },
  { t: 962.848, end: 965.456, text: "宋朝的商业和城市经济很发达" },
  { t: 965.456, end: 967.663, text: "交子是世界上最早的纸币" },
  { t: 967.711, end: 970.859, text: "《清明上河图》画的就是汴京的繁华" },
  { t: 970.907, end: 972.83, text: "汴京的夜市三更才散" },
  { t: 972.83, end: 973.685, text: "五更又开" },
  { t: 973.733, end: 975.584, text: "宋朝养了上百万禁军" },
  { t: 975.584, end: 977.436, text: "军费占了财政的大半" },
  { t: 977.484, end: 978.579, text: "钱花了不少" },
  { t: 978.579, end: 979.892, text: "仗还是打不赢" },
  { t: 979.94, end: 982.171, text: "这套办法防住了内部叛乱" },
  { t: 982.171, end: 984.199, text: "也让宋朝对外一直偏软" },
  { t: 984.247, end: 986.17, text: "一零零四年辽军南下" },
  { t: 986.17, end: 987.025, text: "澶渊之盟" },
  { t: 987.073, end: 988.141, text: "宋真宗亲征" },
  { t: 988.141, end: 989.851, text: "寇准把他推到城头" },
  { t: 989.899, end: 993.039, text: "宋朝每年给辽银十万两绢二十万匹" },
  { t: 993.039, end: 994.713, text: "换来一百多年和平" },
  { t: 994.761, end: 996.966, text: "一零六九年王安石变法" },
  { t: 996.966, end: 999.391, text: "青苗法募役法方田均税法" },
  { t: 999.439, end: 1001.522, text: "想解决财政和军事问题" },
  { t: 1001.522, end: 1002.772, text: "结果引发党争" },
  { t: 1002.82, end: 1004.476, text: "新法旧法来回折腾" },
  { t: 1004.476, end: 1006.339, text: "一直折腾到北宋灭亡" },
  { t: 1006.387, end: 1008.715, text: "一一二七年金军攻破汴京" },
  { t: 1008.715, end: 1009.985, text: "徽钦二帝被掳" },
  { t: 1009.985, end: 1010.831, text: "北宋灭亡" },
  { t: 1010.879, end: 1012.166, text: "史称靖康之变" },
  { t: 1012.166, end: 1014.953, text: "后妃宗室三千多人被押往北方" },
  { t: 1015.001, end: 1016.657, text: "北宋一百六十七年" },
  { t: 1016.657, end: 1018.52, text: "攒下的财富全被抢空" },
  { t: 1018.568, end: 1021.068, text: "同年赵构在南京应天府称帝" },
  { t: 1021.068, end: 1021.901, text: "南宋开始" },
  { t: 1021.949, end: 1023.801, text: "一一三八年定都临安" },
  { t: 1023.849, end: 1025.754, text: "南宋的皇帝多半偏安" },
  { t: 1025.754, end: 1026.812, text: "北伐喊得响" },
  { t: 1026.812, end: 1028.294, text: "真打起来又议和" },
  { t: 1028.342, end: 1030.265, text: "一一四二年岳飞被杀" },
  { t: 1030.265, end: 1031.119, text: "宋金议和" },
  { t: 1031.167, end: 1033.128, text: "岳飞死前留下八个字" },
  { t: 1033.128, end: 1033.999, text: "天日昭昭" },
  { t: 1033.999, end: 1034.871, text: "天日昭昭" },
  { t: 1034.919, end: 1036.737, text: "一二七九年崖山海战" },
  { t: 1036.737, end: 1039.363, text: "陆秀夫背着八岁的小皇帝跳海" },
  { t: 1039.411, end: 1040.611, text: "南宋灭亡" },
  { t: 1040.659, end: 1043.252, text: "一二七一年忽必烈定国号为元" },
  { t: 1043.3, end: 1045.029, text: "一二七九年灭南宋" },
  { t: 1045.029, end: 1045.893, text: "统一天下" },
  { t: 1045.941, end: 1047.83, text: "成吉思汗先统一蒙古" },
  { t: 1047.83, end: 1049.089, text: "西征打到中亚" },
  { t: 1049.137, end: 1050.166, text: "忽必烈建元" },
  { t: 1050.166, end: 1052.841, text: "把草原帝国改成一个中原王朝" },
  { t: 1052.889, end: 1053.957, text: "他定都大都" },
  { t: 1053.957, end: 1055.666, text: "也就是今天的北京" },
  { t: 1055.714, end: 1057.607, text: "元朝把人分成四等" },
  { t: 1057.607, end: 1059.974, text: "蒙古人色目人汉人南人" },
  { t: 1060.022, end: 1062.105, text: "行省制度从这时候开始" },
  { t: 1062.105, end: 1063.355, text: "一直用到今天" },
  { t: 1063.403, end: 1064.884, text: "元曲在勾栏里唱" },
  { t: 1064.884, end: 1067.847, text: "关汉卿马致远都是这个时代的人" },
  { t: 1067.895, end: 1068.8, text: "九十八年" },
  { t: 1068.8, end: 1069.932, text: "十一位皇帝" },
  { t: 1069.98, end: 1070.892, text: "黄河泛滥" },
  { t: 1070.892, end: 1072.031, text: "红巾军起义" },
  { t: 1072.031, end: 1072.943, text: "天下大乱" },
  { t: 1072.991, end: 1075.3, text: "一三六八年明军攻入大都" },
  { t: 1075.3, end: 1076.139, text: "元朝灭亡" },
  { t: 1076.187, end: 1077.854, text: "残余势力退回草原" },
  { t: 1077.902, end: 1080.61, text: "一三六八年朱元璋在应天称帝" },
  { t: 1080.61, end: 1081.235, text: "国号明" },
  { t: 1081.283, end: 1083.506, text: "他是放牛娃和尚乞丐" },
  { t: 1083.554, end: 1085.471, text: "二十四岁参加红巾军" },
  { t: 1085.471, end: 1086.748, text: "四十岁当皇帝" },
  { t: 1086.748, end: 1087.813, text: "用了十六年" },
  { t: 1087.861, end: 1088.993, text: "他废了丞相" },
  { t: 1088.993, end: 1089.898, text: "设锦衣卫" },
  { t: 1089.946, end: 1091.583, text: "太监有二十四衙门" },
  { t: 1091.583, end: 1093.835, text: "司礼监后来能替皇帝批红" },
  { t: 1093.883, end: 1095.478, text: "杀了胡惟庸蓝玉" },
  { t: 1095.478, end: 1096.846, text: "几万人受牵连" },
  { t: 1096.894, end: 1098.283, text: "空印案郭桓案" },
  { t: 1098.283, end: 1099.672, text: "又杀了几万人" },
  { t: 1099.72, end: 1101.221, text: "他给子孙定规矩" },
  { t: 1101.221, end: 1102.507, text: "不许宦官干政" },
  { t: 1102.507, end: 1103.794, text: "不许再设丞相" },
  { t: 1103.842, end: 1105.337, text: "可他死后没几年" },
  { t: 1105.337, end: 1106.619, text: "这两条都破了" },
  { t: 1106.667, end: 1109.26, text: "一三九九年燕王朱棣起兵靖难" },
  { t: 1109.308, end: 1111.183, text: "一四零二年攻入南京" },
  { t: 1111.183, end: 1112.641, text: "建文帝下落不明" },
  { t: 1112.689, end: 1113.985, text: "朱棣迁都北京" },
  { t: 1113.985, end: 1115.066, text: "修永乐大典" },
  { t: 1115.066, end: 1116.578, text: "派郑和七下西洋" },
  { t: 1116.626, end: 1118.33, text: "郑和第一次下西洋" },
  { t: 1118.33, end: 1119.608, text: "六十二艘宝船" },
  { t: 1119.608, end: 1120.886, text: "两万七千多人" },
  { t: 1120.934, end: 1122.971, text: "船队最远到了非洲东岸" },
  { t: 1123.019, end: 1124.678, text: "后来朝廷转向海禁" },
  { t: 1124.678, end: 1125.923, text: "片板不许下海" },
  { t: 1125.923, end: 1128.204, text: "大航海时代就这么错过了" },
  { t: 1128.252, end: 1129.294, text: "明朝中后期" },
  { t: 1129.294, end: 1130.96, text: "美洲白银大量流入" },
  { t: 1130.96, end: 1133.252, text: "银子成了市面上的硬通货" },
  { t: 1133.3, end: 1135.369, text: "一四四九年土木堡之变" },
  { t: 1135.369, end: 1136.818, text: "英宗被瓦剌俘虏" },
  { t: 1136.866, end: 1138.729, text: "于谦在北京另立新君" },
  { t: 1138.729, end: 1140.385, text: "打赢了北京保卫战" },
  { t: 1140.433, end: 1141.766, text: "后来英宗复辟" },
  { t: 1141.766, end: 1142.655, text: "于谦被杀" },
  { t: 1142.703, end: 1144.545, text: "一五二一年嘉靖即位" },
  { t: 1144.545, end: 1146.592, text: "一个大礼议就吵了三年" },
  { t: 1146.64, end: 1148.307, text: "他二十多年不上朝" },
  { t: 1148.355, end: 1149.642, text: "他在宫里炼丹" },
  { t: 1149.642, end: 1151.142, text: "差点被宫女勒死" },
  { t: 1151.142, end: 1152.429, text: "史称壬寅宫变" },
  { t: 1152.477, end: 1154.339, text: "一五七二年万历即位" },
  { t: 1154.339, end: 1155.995, text: "前十年张居正改革" },
  { t: 1156.043, end: 1158.32, text: "一条鞭法把赋役折成银子" },
  { t: 1158.32, end: 1159.562, text: "国库一度充盈" },
  { t: 1159.61, end: 1161.068, text: "后三十多年怠政" },
  { t: 1161.068, end: 1162.943, text: "国本之争闹了十五年" },
  { t: 1162.991, end: 1165.096, text: "一六一八年萨尔浒之战" },
  { t: 1165.096, end: 1166.358, text: "明军四路出击" },
  { t: 1166.358, end: 1167.621, text: "三路全军覆没" },
  { t: 1167.669, end: 1169.574, text: "一六二零年天启即位" },
  { t: 1169.574, end: 1170.632, text: "魏忠贤专权" },
  { t: 1170.68, end: 1172.498, text: "一六二七年崇祯即位" },
  { t: 1172.498, end: 1175.124, text: "十七年换了五十个内阁大学士" },
  { t: 1175.172, end: 1177.579, text: "杀了七个总督十一个巡抚" },
  { t: 1177.627, end: 1178.759, text: "他勤政节俭" },
  { t: 1178.759, end: 1181.702, text: "可国库空虚党争不止天灾不断" },
  { t: 1181.75, end: 1183.219, text: "小冰期连年大旱" },
  { t: 1183.219, end: 1184.898, text: "陕西河南饿殍遍野" },
  { t: 1184.946, end: 1187.402, text: "一六四四年李自成攻入北京" },
  { t: 1187.402, end: 1188.835, text: "崇祯在煤山自缢" },
  { t: 1188.883, end: 1190.626, text: "明朝二百七十六年" },
  { t: 1190.626, end: 1191.715, text: "十六个皇帝" },
  { t: 1191.715, end: 1192.586, text: "明朝灭亡" },
  { t: 1192.634, end: 1194.486, text: "一六四四年清军入关" },
  { t: 1194.534, end: 1196.617, text: "中原已经在李自成手里" },
  { t: 1196.617, end: 1198.284, text: "吴三桂打开山海关" },
  { t: 1198.284, end: 1199.534, text: "清军顺势进来" },
  { t: 1199.582, end: 1202.038, text: "顺治是入关后的第一个皇帝" },
  { t: 1202.038, end: 1203.471, text: "二十四岁就死了" },
  { t: 1203.519, end: 1205.498, text: "一六六一年康熙即位" },
  { t: 1205.498, end: 1205.938, text: "八岁" },
  { t: 1205.938, end: 1207.038, text: "十四岁亲政" },
  { t: 1207.086, end: 1208.382, text: "十六岁除鳌拜" },
  { t: 1208.382, end: 1209.678, text: "二十岁平三藩" },
  { t: 1209.678, end: 1210.974, text: "三十岁收台湾" },
  { t: 1211.022, end: 1213.042, text: "三十六岁签尼布楚条约" },
  { t: 1213.042, end: 1215.467, text: "把黑龙江以东的边界定下来" },
  { t: 1215.515, end: 1217.208, text: "他三次亲征噶尔丹" },
  { t: 1217.208, end: 1218.478, text: "把漠北收进来" },
  { t: 1218.526, end: 1220.081, text: "他学几何学天文" },
  { t: 1220.081, end: 1221.859, text: "让传教士进宫讲课" },
  { t: 1221.907, end: 1222.735, text: "到他晚年" },
  { t: 1222.735, end: 1225.426, text: "外蒙古和西藏都归了清朝管辖" },
  { t: 1225.474, end: 1226.914, text: "他在位六十一年" },
  { t: 1226.914, end: 1229.177, text: "是历史上在位最长的皇帝" },
  { t: 1229.225, end: 1231.17, text: "一七二二年雍正即位" },
  { t: 1231.17, end: 1231.818, text: "十三年" },
  { t: 1231.866, end: 1233.37, text: "九子夺嫡的赢家" },
  { t: 1233.37, end: 1235.088, text: "一上台就收拾兄弟" },
  { t: 1235.088, end: 1236.162, text: "圈禁的圈禁" },
  { t: 1236.162, end: 1237.236, text: "削籍的削籍" },
  { t: 1237.284, end: 1240.062, text: "摊丁入亩设军机处改土归流" },
  { t: 1240.11, end: 1241.777, text: "他批奏折批到半夜" },
  { t: 1241.777, end: 1243.027, text: "一天写几千字" },
  { t: 1243.027, end: 1245.11, text: "十三年就把自己熬垮了" },
  { t: 1245.158, end: 1247.103, text: "一七三五年乾隆即位" },
  { t: 1247.103, end: 1247.751, text: "六十年" },
  { t: 1247.799, end: 1248.711, text: "十全武功" },
  { t: 1248.711, end: 1249.85, text: "修四库全书" },
  { t: 1249.85, end: 1250.762, text: "六下江南" },
  { t: 1250.81, end: 1251.625, text: "到这时候" },

let tl = null;

function buildStage() {
  document.getElementById("stage").innerHTML = PaperCut.buildStage(SHOTS);
}

function buildCaptions() {
  const wrap = document.getElementById("caption-wrap");
  wrap.innerHTML = "";
  CAPS.forEach((s, i) => {
    const line = document.createElement("div");
    line.className = "cap-line";
    line.id = "cap-" + i;

    box.className = "cap-box";
    box.textContent = s.text;
    line.appendChild(box);
    wrap.appendChild(line);

function cameraOf(shot) {
  const c = shot.camera || {};
  const from = c.from || { x: 0, y: 0, scale: 1.02, rot: 0 };
  const to = c.to || { x: 0, y: 0, scale: 1.10, rot: 0 };
  return { from, to };
}

/* 人物：跑步的起伏与摆臂摆腿、披风、主角动作（挥刺 / 拉弓 / 举剑 / 后坐） */
function animateLife(el, shot, t0, dur) {
  const chars = shot.chars || [];
  const persons = el.querySelectorAll(".pc-chars .pc-person-wrap");

  persons.forEach((w, i) => {
    const c = chars[i] || {};
    const role = c.role || "official";
    const pose = c.pose || "stand";
    const dir = c.facing === "left" ? -1 : 1;
    const moving = pose === "run" || pose === "walk";

    const breath = w.querySelectorAll(".pc-breathe");
    const armL = w.querySelectorAll(".pc-arm-l");
    const armR = w.querySelectorAll(".pc-arm-r");
    const legL = w.querySelectorAll(".pc-leg-l");
    const legR = w.querySelectorAll(".pc-leg-r");
    const capeL = w.querySelectorAll(".pc-cape-l");
    const capeR = w.querySelectorAll(".pc-cape-r");

    /* 每个人的步频与相位错开，避免多人同拍像队列 */
    const amp = pose === "run" ? 7 : pose === "walk" ? 4 : 2.2;
    const cycle = (pose === "run" ? .18 : pose === "walk" ? .3 : 1.2) * (1 + (i % 3) * .07);
    const ph = .06 + i * .093;
    const reps = Math.max(2, 2 * Math.floor(dur / (cycle * 2)));

    breath.forEach((b, k) => {
      tl.fromTo(b, { y: 0 }, { y: -amp, duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
        t0 + ph + k * .02);
    });

    if (moving) {
      tl.fromTo(w, { x: 0 }, { x: dir * (pose === "run" ? 26 : 14), duration: dur, ease: "sine.inOut" }, t0);
      const swing = (pose === "run" ? 14 : 8) * (role === "soldier" ? 1.1 : 1);
      /* 切镜即动：靠反向起步与各自步频错开，而不是延后起摆 */
      const s0 = i % 2 ? -1 : 1;
      [[legL, -14, 1], [legR, 14, -1]].forEach(([gs, ox, sgn]) => {
        gs.forEach((g, k) => {
          const base = gsap.getProperty(g, "rotation") || 0;
          tl.fromTo(g, { rotation: base - swing * sgn * s0, svgOrigin: ox + " -44" },
            { rotation: base + swing * sgn * s0, svgOrigin: ox + " -44", duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
            t0 + .02 + k * .01);
        });
      });
      [[armL, -19, -1], [armR, 19, 1]].forEach(([gs, ox, sgn]) => {
        gs.forEach((g) => {
          const base = gsap.getProperty(g, "rotation") || 0;
          tl.fromTo(g, { rotation: base - swing * .55 * sgn * s0, svgOrigin: ox + " -130" },
            { rotation: base + swing * .55 * sgn * s0, svgOrigin: ox + " -130", duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
            t0 + .02);
        });
      });
    } else {
      armL.forEach((g) => {
        const base = gsap.getProperty(g, "rotation") || 0;
        tl.fromTo(g, { rotation: base }, { rotation: base + 1.3 * dir, svgOrigin: "-19 -130", duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 1.7)) }, t0 + .2);
      });
      armR.forEach((g) => {
        const base = gsap.getProperty(g, "rotation") || 0;
        tl.fromTo(g, { rotation: base }, { rotation: base - 1.1 * dir, svgOrigin: "19 -130", duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 2.1)) }, t0 + .3);
      });
    }

    capeL.forEach((p) => tl.fromTo(p, { scaleX: 1 }, { scaleX: 1.12, transformOrigin: "100% 30%", duration: .7, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 1.4)) }, t0 + .1));
    capeR.forEach((p) => tl.fromTo(p, { scaleX: 1 }, { scaleX: 1.1, transformOrigin: "0% 30%", duration: .82, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 1.64)) }, t0 + .1));

    /* 主角动作：按镜头设计 */
    if (role !== "general") return;
    if (shot.id === "r001") {
      [[1.02], [3.06]].forEach(([tt]) => {
        tl.to(w, { x: -12, duration: .24, ease: "power2.in" }, t0 + tt)
          .to(w, { x: 30, duration: .14, ease: "power4.out" }, t0 + tt + .24)
          .to(w, { x: 0, duration: .82, ease: "power2.inOut" }, t0 + tt + .38);
        tl.fromTo("#stage", { x: 0 }, { x: 7, duration: .05, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt + .27);
      });
    } else if (shot.id === "r002") {
      [.9, 2.7].forEach((tt) => {
        tl.fromTo(w, { scale: 1 }, { scale: 1.035, duration: .2, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt);
      });
    } else if (shot.id === "r003") {
      tl.fromTo(w, { y: 0, rotation: 0 }, { y: -6, rotation: -1.2, duration: 1.5, ease: "sine.out" }, t0 + .5);
      tl.to(w, { y: 0, rotation: 0, duration: 2.6, ease: "sine.inOut" }, t0 + 2.2);
    } else if (shot.id === "r004") {
      tl.to(w, { x: -9, duration: 1.25, ease: "sine.out" }, t0 + .35);
      tl.to(w, { x: 12, duration: .1, ease: "power4.out" }, t0 + 1.68);
      tl.to(w, { x: 0, duration: .95, ease: "power2.out" }, t0 + 1.78);
      tl.fromTo("#stage", { x: 0 }, { x: 9, duration: .055, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + 1.7);
    } else if (shot.id === "r005") {
      [1.15, 3.45].forEach((tt) => {
        tl.to(w, { x: 9, duration: .07, ease: "power3.out" }, t0 + tt)
          .to(w, { x: 0, duration: .55, ease: "power2.out" }, t0 + tt + .07);
        tl.fromTo("#stage", { x: 0 }, { x: 10, duration: .06, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt);
      });
    }
  });
}

/* 开场钩子：标题砸屏后 1 秒抖屏，振幅按 1.6 次方衰减到 0 */
function hookShake(el, t0, dur, amp) {
  const n = Math.round(dur * 30);
  for (let k = 0; k <= n; k++) {
    const tt = k / 30;
    const env = Math.pow(1 - tt / dur, 1.6);
    const dx = Math.sin(tt * 11 * 2 * Math.PI) * amp * env;
    const dy = Math.sin(tt * 7.3 * 2 * Math.PI) * amp * .6 * env;
    tl.set(el, { x: dx, y: dy }, t0 + tt);
  }
}

function buildTimeline() {
  const rootDur = parseFloat(document.getElementById("root").dataset.duration) || 0;
  const total = Math.max(CUE.filmEnd || 0, rootDur, SHOTS.length ? SHOTS[SHOTS.length - 1].t1 + 5.4 : 5.4);
  tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

  gsap.set(".shot", { autoAlpha: 0 });

  SHOTS.forEach((shot, i) => {
    const el = document.querySelectorAll("#stage .shot")[i];
    if (!el) return;
    const t0 = Number(shot.t0) || 0;
    const t1 = Number(shot.t1) || t0 + 3.5;
    const dur = Math.max(0.4, t1 - t0);
    const world = el.querySelector(".shot-world");
    const cam = cameraOf(shot);
    const ease = shot.camera && shot.camera.ease ? shot.camera.ease : "sine.inOut";
    const hook = !!shot.hook;

    tl.set(el, { autoAlpha: 1 }, t0);

    /* 运镜：两段式（推进 → 收束），缩放走对数空间，速度变化不顿挫 */
    const cf = cam.from, ct = cam.to;
    const cs = (a, b, r) => Math.exp(Math.log(a) * (1 - r) + Math.log(b) * r);
    const mid = {
      x: (cf.x || 0) + ((ct.x || 0) - (cf.x || 0)) * .58,
      y: (cf.y || 0) + ((ct.y || 0) - (cf.y || 0)) * .58,
      scale: cs(cf.scale || 1.02, ct.scale || 1.10, .58),
      rotation: (cf.rot || 0) + ((ct.rot || 0) - (cf.rot || 0)) * .58
    };
    tl.fromTo(world,
      { x: cf.x || 0, y: cf.y || 0, scale: cf.scale || 1.02, rotation: cf.rot || 0 },
      { x: mid.x, y: mid.y, scale: mid.scale, rotation: mid.rotation, duration: dur * .58, ease: "power1.inOut" }, t0);
    tl.to(world,
      { x: ct.x || 0, y: ct.y || 0, scale: ct.scale || 1.10, rotation: ct.rot || 0, duration: dur * .42, ease },
      t0 + dur * .58);

    if (hook) {
      /* 钩子：各层从下方砸入，落定后抖屏 1 秒 */
      [
        [".pc-sky", -22, 1.05, 0],
        [".pc-far", 26, 1.04, .02],
        [".pc-mid", 64, 1.10, .04],
        [".pc-action", 96, 1.14, .06],
        [".pc-fore", 26, 1.04, .08]
      ].forEach(([sel, y0, s0, delay]) => {
        const layer = el.querySelector(sel);
        if (!layer) return;
        tl.fromTo(layer, { x: 0, y: y0, scale: s0, transformOrigin: "50% 82%" },
          { x: 0, y: 0, scale: 1, duration: .52, ease: "power4.out" }, t0 + delay);
      });
      hookShake(el, t0, 1.0, 14);
      tl.fromTo("#hook-flash", { opacity: 0 }, { opacity: .95, duration: .04, ease: "none" }, t0);
      tl.to("#hook-flash", { opacity: 0, duration: .32, ease: "power2.out" }, t0 + .05);
      tl.fromTo("#hook-ring", { opacity: 0, scale: .32 }, { opacity: .85, scale: 1, duration: .16, ease: "power4.out" }, t0 + .03);
      tl.to("#hook-ring", { opacity: 0, scale: 1.55, duration: .44, ease: "power2.out" }, t0 + .20);
    } else {
      /* 手持浮动：整镜极轻微漂移，去掉三脚架感 */
      const hs = i % 2 ? 1 : -1;
      tl.fromTo(el, { x: 0, y: 0 }, { x: hs * 5, y: -3 - (i % 3), duration: dur, ease: "sine.inOut" }, t0);

      /* 层间视差：远景慢、近景快 */
      el.querySelectorAll(".pc-layer").forEach((layer, j) => {
        const depth = parseFloat(layer.dataset.depth || "1");
        const drift = (j % 2 ? 1 : -1) * (12 + depth * 22);
        tl.fromTo(layer, { x: -drift * .55, y: -6 }, { x: drift, y: 9, duration: dur, ease: "sine.inOut" }, t0);
      });
    }

    animateLife(el, shot, t0, dur);
    animateEnvironment(el, shot, t0, dur);

    /* 标题 */
    const title = el.querySelector(".shot-title");
    if (title) {
      if (hook) {
        tl.set(title, { xPercent: -50 }, t0);
        tl.fromTo(title, { opacity: 0, y: 62, scale: 1.52 },
          { opacity: 1, y: 0, scale: 1, duration: .27, ease: "power4.out" }, t0 + .02);
        tl.fromTo(title, { scale: 1 }, { scale: 1.032, duration: .42, ease: "power2.out" }, t0 + .30);
        tl.to(title, { scale: 1, duration: .55, ease: "sine.inOut" }, t0 + .72);
        const kick = title.querySelector(".tc-kicker");
        const sub = title.querySelector(".tc-sub");
        if (kick) {
          tl.set(kick, { opacity: 0 }, t0);
          tl.fromTo(kick, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .32, ease: "power3.out" }, t0 + .20);
        }
        if (sub) {
          tl.set(sub, { opacity: 0 }, t0);
          tl.fromTo(sub, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .36, ease: "power3.out" }, t0 + .36);
        }
        tl.to(title, { opacity: 0, y: -26, duration: .38, ease: "power2.in" }, Math.max(t0 + .5, t1 - .46));
      } else {
        tl.fromTo(title, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, t0 + .12);
        tl.to(title, { opacity: 0, y: -18, duration: .38, ease: "power2.in" }, Math.max(t0 + .5, t1 - .48));
      }
    }

    /* 纸片转场：章节切换或显式声明 */
    if (shot.wipe) {
      tl.set("#paper-wipe", { visibility: "visible" }, Math.max(0, t0 - .22));
      tl.fromTo("#paper-wipe", { xPercent: -105 }, { xPercent: 105, duration: .44, ease: "power2.inOut" }, Math.max(0, t0 - .22));
      tl.set("#paper-wipe", { visibility: "hidden" }, t0 + .24);
    }

    tl.set(el, { autoAlpha: 0 }, t1);
  });

  /* 字幕 */
  CAPS.forEach((s, i) => {
    const el = document.getElementById("cap-" + i);
    if (!el) return;
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .01, ease: "none" }, s.t);
    tl.to(el, { opacity: 0, duration: .01, ease: "none" }, Math.max(s.t + .12, s.end - .04));
  });

  /* 光扫 */
  tl.fromTo("#light-sweep", { xPercent: -22, opacity: .18 }, { xPercent: 22, opacity: .42, duration: 7, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(total / 7) }, 0);

  /* 片尾 */
  const endAt = total - 5.4;
  if (endAt > 0) {
    tl.to("#stage, #caption-wrap, #subtitle-veil, #vignette", { opacity: 0, duration: .7 }, endAt);
    tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.inOut" }, endAt + .15);
    tl.fromTo(".ec-seal", { opacity: 0, scale: 1.3, rotation: -16 }, { opacity: 1, scale: 1, rotation: -6, duration: .6, ease: "back.out(2)" }, endAt + .35);
    tl.fromTo(".ec-kicker, .ec-title, .ec-sub, .ec-next, .ec-brand", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .65, stagger: .14 }, endAt + .55);
  }

  window.__timelines["china-emperors-20min"] = tl;
}

buildStage();
buildCaptions();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(buildTimeline).catch(buildTimeline);
} else {
  buildTimeline();
}
  </script>
</body>
</html>
