  { t: 80.795, end: 82.366, text: "觉得王这个字不够用" },
  { t: 82.396, end: 83.931, text: "三皇五帝各取一字" },
  { t: 83.931, end: 84.698, text: "他叫皇帝" },
  { t: 84.728, end: 85.874, text: "自己是第一个" },
  { t: 85.874, end: 87.019, text: "所以叫始皇帝" },
  { t: 87.019, end: 89.12, text: "后代从二世三世排到万世" },
  { t: 89.15, end: 90.779, text: "他废分封行郡县" },
  { t: 90.779, end: 92.64, text: "天下分成三十六郡" },
  { t: 92.67, end: 94.161, text: "中央设三公九卿" },
  { t: 94.161, end: 95.866, text: "地方官由皇帝任免" },
  { t: 95.866, end: 96.718, text: "不再世袭" },
  { t: 96.748, end: 98.082, text: "文字统一成小篆" },
  { t: 98.082, end: 99.225, text: "车轨统一宽度" },
  { t: 99.225, end: 100.558, text: "度量衡统一标准" },
  { t: 100.588, end: 102.059, text: "北修长城挡匈奴" },
  { t: 102.059, end: 103.53, text: "南开灵渠通粮道" },
  { t: 103.53, end: 105.001, text: "修驰道直通天下" },
  { t: 105.031, end: 106.295, text: "驰道宽五十步" },
  { t: 106.295, end: 108.192, text: "每隔三丈种一棵松树" },
  { t: 108.192, end: 109.667, text: "从咸阳修到燕齐" },
  { t: 109.697, end: 111.139, text: "他每天用秤称奏章" },
  { t: 111.139, end: 112.582, text: "批不完一石不休息" },
  { t: 112.612, end: 115.08, text: "秦法细到在路上倒灰都要受罚" },
  { t: 115.08, end: 116.409, text: "老百姓动辄得咎" },
  { t: 116.439, end: 118.31, text: "这些事后来每个王朝都做" },
  { t: 118.31, end: 120.351, text: "但第一个做的要挨最多的骂" },
  { t: 120.381, end: 121.636, text: "前二一三年焚书" },
  { t: 121.636, end: 124.504, text: "前二一二年坑杀四百六十多个方士和" },
  { t: 124.504, end: 124.862, text: "儒生" },
  { t: 124.892, end: 125.855, text: "他想要长生" },
  { t: 125.855, end: 128.743, text: "派徐福带三千童男童女出海找仙药" },
  { t: 128.773, end: 130.744, text: "方士说海上有三座仙山" },
  { t: 130.744, end: 132.518, text: "徐福一去就没了消息" },
  { t: 132.548, end: 133.546, text: "他一边求仙" },
  { t: 133.546, end: 134.944, text: "一边给自己修陵" },
  { t: 134.944, end: 136.342, text: "两件事都没耽误" },
  { t: 136.372, end: 137.821, text: "他五次巡游天下" },
  { t: 137.821, end: 139.477, text: "最后一次走到沙丘" },
  { t: 139.477, end: 140.098, text: "病死了" },
  { t: 140.098, end: 140.926, text: "四十九岁" },
  { t: 140.956, end: 143.028, text: "死前他写信给长子扶苏" },
  { t: 143.028, end: 144.686, text: "让他回咸阳办丧事" },
  { t: 144.716, end: 145.803, text: "信还没发出去" },
  { t: 145.803, end: 146.708, text: "赵高扣下了" },
  { t: 146.738, end: 148.28, text: "赵高和李斯合谋" },
  { t: 148.28, end: 148.941, text: "立胡亥" },
  { t: 148.941, end: 150.704, text: "逼扶苏和蒙恬自杀" },
  { t: 150.734, end: 151.692, text: "胡亥即位" },
  { t: 151.692, end: 152.65, text: "赵高掌权" },
  { t: 152.65, end: 154.566, text: "在朝堂上指鹿为马" },
  { t: 154.596, end: 157.79, text: "前二零九年陈胜吴广在大泽乡起义" },
  { t: 157.79, end: 159.92, text: "喊出王侯将相宁有种乎" },
  { t: 159.95, end: 161.625, text: "六国旧贵族跟着起兵" },
  { t: 161.625, end: 163.3, text: "项羽在巨鹿破釜沉舟" },
  { t: 163.3, end: 164.417, text: "打垮秦军主力" },
  { t: 164.447, end: 166.719, text: "秦军主力一支在北边防匈奴" },
  { t: 166.719, end: 168.234, text: "一支在南边守岭南" },
  { t: 168.234, end: 169.37, text: "关中反而空虚" },
  { t: 169.4, end: 172.25, text: "前二零七年刘邦进咸阳" },
  { t: 172.25, end: 173.39, text: "子婴投降" },
  { t: 173.39, end: 173.96, text: "秦亡" },
  { t: 173.99, end: 175.41, text: "从统一到灭亡" },
  { t: 175.41, end: 176.12, text: "十五年" },
  { t: 176.15, end: 176.938, text: "秦亡得快" },
  { t: 176.938, end: 178.908, text: "不是因为它什么都没做" },
  { t: 178.908, end: 180.484, text: "而是因为做得太绝" },
  { t: 180.514, end: 184.169, text: "修长城修驰道修阿房宫修骊山陵" },
  { t: 184.169, end: 185.735, text: "每一件都要人" },
  { t: 185.765, end: 187.715, text: "骊山陵修了三十多年" },
  { t: 187.715, end: 189.665, text: "前后征发七十多万人" },
  { t: 189.695, end: 191.567, text: "陵里用水银做江河湖海" },
  { t: 191.567, end: 193.065, text: "用兵马俑守在地下" },
  { t: 193.095, end: 194.682, text: "长城从临洮修到辽东" },
  { t: 194.682, end: 196.974, text: "把秦赵燕三家的旧墙连成一条" },
  { t: 197.004, end: 199.59, text: "这道墙后来成了中原王朝的北墙" },
  { t: 199.59, end: 200.883, text: "一代一代往下修" },
  { t: 200.913, end: 201.872, text: "更要命的是" },
  { t: 201.872, end: 203.406, text: "秦始皇没有立皇后" },
  { t: 203.406, end: 204.557, text: "也没明确太子" },
  { t: 204.587, end: 205.155, text: "他一死" },
  { t: 205.155, end: 207.236, text: "继承就成了一场宫廷政变" },
  { t: 207.266, end: 209.879, text: "秦的制度却被继承了两千年" },
  { t: 209.879, end: 211.403, text: "郡县文字度量衡" },
  { t: 211.403, end: 212.274, text: "一样没丢" },
  { t: 212.304, end: 213.601, text: "接下来上场的是刘邦" },
  { t: 213.631, end: 214.429, text: "沛县亭长" },
  { t: 214.429, end: 216.226, text: "四十多岁还在混日子" },
  { t: 216.256, end: 217.157, text: "秦末大乱" },
  { t: 217.157, end: 217.834, text: "他起兵" },
  { t: 217.834, end: 218.735, text: "先入咸阳" },
  { t: 218.765, end: 219.632, text: "进了咸阳" },
  { t: 219.632, end: 221.582, text: "他跟老百姓约法三章" },
  { t: 221.582, end: 222.449, text: "杀人者死" },
  { t: 222.449, end: 223.749, text: "伤人及盗抵罪" },
  { t: 223.779, end: 224.8, text: "项羽进了关" },
  { t: 224.8, end: 225.822, text: "摆下鸿门宴" },
  { t: 225.822, end: 228.273, text: "刘邦低头认错才捡回一条命" },
  { t: 228.303, end: 230.096, text: "后来楚汉相争四年" },
  { t: 230.096, end: 231.217, text: "萧何管后方" },
  { t: 231.217, end: 232.337, text: "张良出主意" },
  { t: 232.337, end: 233.234, text: "韩信带兵" },
  { t: 233.264, end: 235.511, text: "韩信本来在项羽手下不受重用" },
  { t: 235.511, end: 236.202, text: "跑到汉中" },
  { t: 236.202, end: 237.758, text: "萧何连夜把他追回来" },
  { t: 237.788, end: 238.958, text: "刘邦筑坛拜将" },
  { t: 238.958, end: 240.129, text: "把兵权交给他" },
  { t: 240.129, end: 241.689, text: "这才有了还定三秦" },
  { t: 241.719, end: 244.029, text: "公元前二零二年垓下之战" },
  { t: 244.029, end: 244.869, text: "四面楚歌" },
  { t: 244.869, end: 246.129, text: "项羽自刎乌江" },
  { t: 246.159, end: 247.075, text: "一个平民" },
  { t: 247.075, end: 247.991, text: "七年时间" },
  { t: 247.991, end: 248.907, text: "成了天子" },
  { t: 248.937, end: 250.556, text: "他坐上去才知道椅子烫" },
  { t: 250.556, end: 252.014, text: "异姓王一个接一个反" },
  { t: 252.044, end: 253.555, text: "韩信彭越英布" },
  { t: 253.555, end: 255.317, text: "最后都被他除掉" },
  { t: 255.347, end: 257.335, text: "公元前二零零年亲征匈奴" },
  { t: 257.335, end: 259.143, text: "在白登被围了七天七夜" },
  { t: 259.173, end: 260.903, text: "靠陈平贿赂单于阏氏" },
  { t: 260.903, end: 261.864, text: "才脱身回来" },
  { t: 261.894, end: 264.033, text: "从那以后他不提打匈奴" },
  { t: 264.033, end: 265.102, text: "改成了和亲" },
  { t: 265.132, end: 266.992, text: "刘邦死前杀白马盟誓" },
  { t: 266.992, end: 268.233, text: "说非刘氏而王" },
  { t: 268.233, end: 269.266, text: "天下共击之" },
  { t: 269.296, end: 270.13, text: "刘邦死后" },
  { t: 270.13, end: 271.59, text: "吕后掌权十五年" },
  { t: 271.59, end: 274.301, text: "差点把刘家天下变成吕家天下" },
  { t: 274.331, end: 276.414, text: "老臣周勃陈平发动政变" },
  { t: 276.414, end: 277.664, text: "才把吕氏除掉" },
  { t: 277.664, end: 278.914, text: "迎回代王刘恒" },
  { t: 278.944, end: 281.572, text: "文景两代黄老无为轻徭薄赋" },
  { t: 281.572, end: 283.324, text: "老百姓终于能喘气" },
  { t: 283.354, end: 284.239, text: "到武帝初年" },
  { t: 284.239, end: 286.01, text: "国库里的钱串绳都烂了" },
  { t: 286.01, end: 287.604, text: "粮仓的谷子堆到发霉" },
  { t: 287.634, end: 289.487, text: "文帝自己穿粗布衣服" },
  { t: 289.487, end: 290.517, text: "想修个露台" },
  { t: 290.517, end: 292.576, text: "一算要花十户人家的钱" },
  { t: 292.576, end: 292.988, text: "算了" },
  { t: 293.018, end: 294.215, text: "缇萦上书救父" },
  { t: 294.215, end: 295.611, text: "文帝就废了肉刑" },
  { t: 295.641, end: 298.691, text: "景帝时公元前一五四年七国之乱" },
  { t: 298.691, end: 299.78, text: "三个月平定" },
  { t: 299.81, end: 302.265, text: "真正把汉朝推到顶点的是汉武帝刘彻" },
  { t: 302.295, end: 303.199, text: "十六岁即位" },
  { t: 303.199, end: 304.285, text: "在位五十四年" },
  { t: 304.285, end: 305.551, text: "打了四十四年仗" },
  { t: 305.581, end: 306.139, text: "推恩令" },
  { t: 306.139, end: 308.183, text: "让诸侯王的封地越分越小" },
  { t: 308.213, end: 310.049, text: "盐铁官营均输平准" },
  { t: 310.049, end: 311.656, text: "把财政抓回中央" },
  { t: 311.686, end: 312.617, text: "独尊儒术" },
  { t: 312.617, end: 313.315, text: "设太学" },
  { t: 313.315, end: 315.641, text: "给帝国一套统一的说法" },
  { t: 315.671, end: 317.319, text: "派卫青霍去病打匈奴" },
  { t: 317.319, end: 318.601, text: "把战线推到漠北" },
  { t: 318.631, end: 320.3, text: "前一一九年漠北之战" },
  { t: 320.3, end: 321.783, text: "两人各带五万骑兵" },
  { t: 321.783, end: 322.895, text: "出塞两千多里" },
  { t: 322.925, end: 324.312, text: "霍去病封狼居胥" },
  { t: 324.312, end: 325.698, text: "那年才二十出头" },
  { t: 325.728, end: 326.963, text: "张骞出使西域" },
  { t: 326.963, end: 328.404, text: "被匈奴扣了十年" },
  { t: 328.404, end: 330.668, text: "回来时一百多人只剩两个" },
  { t: 330.698, end: 332.718, text: "丝绸之路从这时候开始" },
  { t: 332.718, end: 334.939, text: "中国的丝绸一直卖到罗马" },
  { t: 334.969, end: 335.858, text: "代价也重" },
  { t: 335.858, end: 336.748, text: "连年用兵" },
  { t: 336.748, end: 337.637, text: "国库空了" },
  { t: 337.637, end: 339.194, text: "登记的户口减半" },
  { t: 339.224, end: 340.512, text: "老百姓交不起税" },
  { t: 340.512, end: 341.248, text: "流民遍地" },
  { t: 341.248, end: 342.352, text: "各地起义不断" },
  { t: 342.382, end: 343.69, text: "晚年巫蛊之祸" },
  { t: 343.69, end: 345.433, text: "太子刘据被逼自杀" },
  { t: 345.433, end: 346.959, text: "皇后卫子夫自尽" },
  { t: 346.989, end: 348.311, text: "他立幼子刘弗陵" },
  { t: 348.311, end: 350.388, text: "又杀了孩子母亲钩弋夫人" },
  { t: 350.388, end: 351.521, text: "防止太后干政" },
  { t: 351.551, end: 354.264, text: "公元前八十九年他下轮台罪己诏" },
  { t: 354.264, end: 355.427, text: "承认自己错了" },
  { t: 355.457, end: 356.611, text: "汉武帝之后" },
  { t: 356.611, end: 357.535, text: "霍光辅政" },
  { t: 357.535, end: 358.458, text: "昭宣中兴" },
  { t: 358.488, end: 359.644, text: "昭帝八岁即位" },
  { t: 359.644, end: 360.993, text: "霍光掌权二十年" },
  { t: 361.023, end: 362.345, text: "霍光废过一个只当了" },
  { t: 362.345, end: 363.814, text: "二十七天皇帝的昌邑王" },
  { t: 363.844, end: 366.095, text: "汉宣帝是从民间找回来的皇孙" },
  { t: 366.095, end: 366.614, text: "坐过牢" },
  { t: 366.614, end: 367.999, text: "知道老百姓的难处" },
  { t: 368.029, end: 370.54, text: "再往后元帝成帝哀帝" },
  { t: 370.54, end: 372.214, text: "一代不如一代" },
  { t: 372.244, end: 373.34, text: "外戚王氏掌权" },
  { t: 373.34, end: 375.532, text: "王莽装了几十年的谦谦君子" },
  { t: 375.532, end: 376.994, text: "朝野都说他是圣人" },
  { t: 377.024, end: 378.798, text: "公元八年王莽代汉" },
  { t: 378.798, end: 379.685, text: "建立新朝" },
  { t: 379.715, end: 380.806, text: "王莽改制" },
  { t: 380.806, end: 383.26, text: "改地名改币制改土地" },
  { t: 383.26, end: 384.351, text: "越改越乱" },
  { t: 384.381, end: 386.488, text: "他把全国的官名地名改了一遍" },
  { t: 386.488, end: 388.109, text: "连匈奴单于的印都换了" },
  { t: 388.139, end: 389.586, text: "十五年天下大乱" },
  { t: 389.586, end: 390.826, text: "绿林赤眉起义" },
  { t: 390.826, end: 391.653, text: "新朝灭亡" },
  { t: 391.683, end: 394.131, text: "公元二十五年刘秀称帝" },
  { t: 394.131, end: 395.111, text: "重建汉朝" },
  { t: 395.111, end: 396.09, text: "史称东汉" },
  { t: 396.12, end: 397.532, text: "他是刘邦的九世孙" },
  { t: 397.532, end: 399.826, text: "到他那辈已经是个种地的宗室" },
  { t: 399.856, end: 401.832, text: "起兵时穷得买不起马" },
  { t: 401.832, end: 403.15, text: "只能骑牛上阵" },
  { t: 403.18, end: 403.997, text: "昆阳之战" },
  { t: 403.997, end: 406.856, text: "一万多人打败王莽四十二万大军" },
  { t: 406.886, end: 410.623, text: "当皇帝后他释放奴婢度田裁并郡县" },
  { t: 410.623, end: 411.619, text: "光武中兴" },
  { t: 411.649, end: 412.797, text: "跟刘邦不一样" },
  { t: 412.797, end: 413.945, text: "他没有杀功臣" },
  { t: 413.945, end: 416.049, text: "云台二十八将都得了善终" },
  { t: 416.079, end: 417.514, text: "明帝章帝接手" },
  { t: 417.514, end: 418.47, text: "吏治清明" },
  { t: 418.47, end: 419.905, text: "史称明章之治" },
  { t: 419.935, end: 421.132, text: "窦宪北击匈奴" },
  { t: 421.132, end: 422.729, text: "在燕然山刻石记功" },
  { t: 422.729, end: 424.525, text: "那是东汉武功的顶点" },
  { t: 424.555, end: 425.971, text: "蔡伦改进造纸术" },
  { t: 425.971, end: 427.185, text: "张衡造地动仪" },
  { t: 427.185, end: 428.399, text: "都在这个朝代" },
  { t: 428.429, end: 429.631, text: "但东汉的皇帝" },
  { t: 429.631, end: 430.633, text: "整体偏年轻" },
  { t: 430.663, end: 432.002, text: "和帝十岁即位" },
  { t: 432.002, end: 433.34, text: "殇帝一百多天" },
  { t: 433.34, end: 434.233, text: "冲帝两岁" },
  { t: 434.233, end: 435.125, text: "质帝八岁" },
  { t: 435.155, end: 436.039, text: "东汉的皇帝" },
  { t: 436.039, end: 437.807, text: "很多不到三十岁就死了" },
  { t: 437.837, end: 438.597, text: "皇帝小" },
  { t: 438.597, end: 439.611, text: "太后临朝" },
  { t: 439.611, end: 440.625, text: "外戚掌权" },
  { t: 440.655, end: 441.545, text: "皇帝长大" },
  { t: 441.545, end: 443.103, text: "靠宦官除掉外戚" },
  { t: 443.103, end: 444.216, text: "宦官再掌权" },
  { t: 444.246, end: 445.269, text: "外戚和宦官" },
  { t: 445.269, end: 446.905, text: "像钟摆一样来回摆" },
  { t: 446.935, end: 448.699, text: "中间还夹着一批士大夫" },
  { t: 448.699, end: 450.287, text: "他们看不惯外戚宦官" },
  { t: 450.287, end: 451.169, text: "一次次上书" },
  { t: 451.199, end: 452.481, text: "结果就是党锢" },
  { t: 452.481, end: 454.19, text: "读书人被打成朋党" },
  { t: 454.19, end: 455.045, text: "不许做官" },
  { t: 455.075, end: 457.192, text: "梁冀当了二十年跋扈将军" },
  { t: 457.192, end: 458.925, text: "最后被宦官围在家里" },
  { t: 458.925, end: 459.31, text: "自杀" },
  { t: 459.34, end: 460.964, text: "桓帝灵帝公开卖官" },
  { t: 460.964, end: 462.589, text: "三公标价一千万钱" },
  { t: 462.619, end: 464.51, text: "一八四年黄巾起义" },
  { t: 464.51, end: 466.401, text: "张角喊出苍天已死" },
  { t: 466.401, end: 467.346, text: "黄天当立" },
  { t: 467.376, end: 469.274, text: "州郡长官趁机拥兵自重" },
  { t: 469.274, end: 470.982, text: "朝廷只好把兵权下放" },
  { t: 471.012, end: 472.934, text: "一八九年董卓进京" },
  { t: 472.934, end: 474.376, text: "废少帝立献帝" },
  { t: 474.376, end: 475.818, text: "东汉名存实亡" },
  { t: 475.848, end: 478.184, text: "一九六年曹操把献帝迎到许都" },
  { t: 478.184, end: 479.442, text: "挟天子以令诸侯" },
  { t: 479.472, end: 480.936, text: "二零零年官渡之战" },
  { t: 480.936, end: 482.949, text: "曹操两万人打垮袁绍十万" },
  { t: 482.979, end: 484.497, text: "二零八年赤壁之战" },
  { t: 484.497, end: 485.636, text: "孙刘联军五万" },
  { t: 485.636, end: 487.533, text: "一把火烧了曹操的水军" },
  { t: 487.563, end: 489.385, text: "那一年周瑜三十三岁" },
  { t: 489.385, end: 490.802, text: "诸葛亮二十七岁" },
  { t: 490.802, end: 492.017, text: "曹操五十三岁" },
  { t: 492.047, end: 494.958, text: "公元二二零年曹丕逼汉献帝禅让" },
  { t: 494.958, end: 495.79, text: "东汉结束" },
  { t: 495.82, end: 497.502, text: "曹丕称帝的第二年" },
  { t: 497.502, end: 498.973, text: "刘备在成都称帝" },
  { t: 498.973, end: 499.604, text: "国号汉" },
  { t: 499.634, end: 501.088, text: "二二一年刘备伐吴" },
  { t: 501.088, end: 503.45, text: "第二年在夷陵被陆逊火烧连营" },
  { t: 503.45, end: 504.722, text: "退到白帝城托孤" },
  { t: 504.752, end: 507.509, text: "二二九年孙权在建业称帝" },
  { t: 507.509, end: 508.511, text: "三国鼎立" },
  { t: 508.541, end: 510.358, text: "曹丕推行九品中正制" },
  { t: 510.358, end: 511.367, text: "选官看家世" },
  { t: 511.367, end: 512.578, text: "门阀从此坐大" },
  { t: 512.608, end: 513.5, text: "曹魏这边" },
  { t: 513.5, end: 516.847, text: "司马懿熬死了曹操曹丕曹叡三代人" },
  { t: 516.877, end: 518.606, text: "二四九年高平陵之变" },
  { t: 518.606, end: 519.952, text: "他装病骗过曹爽" },
  { t: 519.952, end: 521.489, text: "一夜之间夺了兵权" },
  { t: 521.519, end: 523.027, text: "二六三年魏灭蜀" },
  { t: 523.027, end: 523.888, text: "刘禅出降" },
  { t: 523.888, end: 524.75, text: "乐不思蜀" },
  { t: 524.78, end: 527.127, text: "三国的故事被演义讲了几百年" },
  { t: 527.127, end: 528.21, text: "真正的历史里" },
  { t: 528.21, end: 529.474, text: "曹操到死没称帝" },
  { t: 529.504, end: 531.477, text: "二六五年司马炎代魏建晋" },
  { t: 531.507, end: 533.034, text: "二八零年晋灭吴" },
  { t: 533.034, end: 534.342, text: "天下重新统一" },
  { t: 534.372, end: 535.818, text: "统一只维持了十一年" },
  { t: 535.848, end: 537.3, text: "司马炎大封宗室" },
  { t: 537.3, end: 538.338, text: "二十七个王" },
  { t: 538.338, end: 539.375, text: "手里都有兵" },
  { t: 539.405, end: 541.075, text: "他自己后宫上万人" },
  { t: 541.075, end: 542.327, text: "坐着羊车乱逛" },
  { t: 542.327, end: 543.788, text: "羊停在哪就住哪" },
  { t: 543.818, end: 545.204, text: "石崇和王恺斗富" },
  { t: 545.204, end: 546.591, text: "一个用蜡当柴烧" },
  { t: 546.591, end: 547.977, text: "一个用糖水刷锅" },
  { t: 548.007, end: 548.598, text: "他一死" },
  { t: 548.598, end: 550.372, text: "八王之乱打了十六年" },
  { t: 550.402, end: 552.696, text: "三一一年刘曜攻破洛阳" },
  { t: 552.696, end: 553.843, text: "晋怀帝被俘" },
  { t: 553.843, end: 555.219, text: "史称永嘉之乱" },
  { t: 555.249, end: 557.461, text: "匈奴鲜卑羯氐羌" },
  { t: 557.461, end: 559.356, text: "五胡先后建国" },
  { t: 559.356, end: 561.252, text: "北方打成一片" },
  { t: 561.282, end: 563.099, text: "三一六年长安陷落" },
  { t: 563.099, end: 564.007, text: "西晋灭亡" },
  { t: 564.037, end: 566.185, text: "三一七年司马睿在建康称帝" },
  { t: 566.185, end: 566.901, text: "东晋开始" },
  { t: 566.931, end: 568.719, text: "北方士族大批南迁" },
  { t: 568.719, end: 570.06, text: "史称衣冠南渡" },
  { t: 570.09, end: 571.323, text: "王导一手安排" },
  { t: 571.323, end: 573.171, text: "司马睿登基后开大会" },
  { t: 573.171, end: 574.609, text: "拉着他同坐御床" },
  { t: 574.609, end: 575.842, text: "王与马共天下" },
  { t: 575.872, end: 576.766, text: "祖逖北伐" },
  { t: 576.766, end: 577.661, text: "中流击楫" },
  { t: 577.661, end: 579.003, text: "收复黄河以南" },
  { t: 579.003, end: 580.568, text: "朝廷却不给后援" },
  { t: 580.598, end: 581.49, text: "东晋的皇帝" },
  { t: 581.49, end: 583.095, text: "很多是门阀扶上去的" },
  { t: 583.125, end: 586.185, text: "三八三年苻坚带号称百万的大军南下" },
  { t: 586.215, end: 587.079, text: "淝水之战" },
  { t: 587.079, end: 589.022, text: "谢玄八万人把他打垮" },
  { t: 589.052, end: 590.391, text: "苻坚败退回北方" },
  { t: 590.391, end: 591.921, text: "前秦跟着四分五裂" },
  { t: 591.951, end: 593.21, text: "北魏趁机崛起" },
  { t: 593.21, end: 594.05, text: "统一北方" },
  { t: 594.08, end: 595.385, text: "这一仗保住了江南" },
  { t: 595.385, end: 597.342, text: "也保住了汉文化的半壁江山" },
  { t: 597.372, end: 598.988, text: "四二零年刘裕代晋" },
  { t: 598.988, end: 599.796, text: "南朝开始" },
  { t: 599.826, end: 600.672, text: "宋齐梁陈" },
  { t: 600.672, end: 602.788, text: "四个朝代一百六十九年" },
  { t: 602.818, end: 603.993, text: "刘裕出身寒门" },
  { t: 603.993, end: 605.363, text: "小时候砍柴打鱼" },
  { t: 605.363, end: 605.95, text: "打仗猛" },
  { t: 605.98, end: 607.427, text: "宋文帝元嘉年间" },
  { t: 607.427, end: 608.874, text: "江南太平三十年" },
  { t: 608.874, end: 610.114, text: "史称元嘉之治" },
  { t: 610.144, end: 611.406, text: "但元嘉北伐失败" },
  { t: 611.406, end: 613.209, text: "北魏太武帝打到长江边" },
  { t: 613.209, end: 614.291, text: "史称元嘉草草" },
  { t: 614.321, end: 615.96, text: "北边北魏统一北方" },
  { t: 615.96, end: 617.395, text: "孝文帝迁都洛阳" },
  { t: 617.425, end: 619.703, text: "改汉姓穿汉服说汉话" },
  { t: 619.703, end: 622.235, text: "连皇族拓跋氏都改姓元" },
  { t: 622.265, end: 623.076, text: "迁都那年" },
  { t: 623.076, end: 624.495, text: "他骗群臣说南征" },
  { t: 624.495, end: 625.306, text: "走到洛阳" },
  { t: 625.306, end: 626.522, text: "大家不肯走了" },
  { t: 626.552, end: 628.129, text: "北魏后期六镇兵变" },
  { t: 628.129, end: 629.312, text: "尔朱荣进洛阳" },
  { t: 629.312, end: 630.889, text: "把朝臣杀了个精光" },
  { t: 630.919, end: 632.287, text: "北魏一分为二" },
  { t: 632.287, end: 633.198, text: "东魏西魏" },
  { t: 633.198, end: 634.794, text: "再变成北齐北周" },
  { t: 634.824, end: 635.664, text: "南朝的齐朝" },
  { t: 635.664, end: 637.344, text: "二十三年换了七个皇帝" },
  { t: 637.374, end: 639.977, text: "南边梁武帝萧衍在位四十八年" },
  { t: 639.977, end: 640.378, text: "信佛" },
  { t: 640.408, end: 641.705, text: "四次舍身同泰寺" },
  { t: 641.705, end: 643.372, text: "大臣凑钱把他赎回来" },
  { t: 643.402, end: 645.26, text: "五四八年侯景之乱" },
  { t: 645.26, end: 646.421, text: "建康被攻破" },
  { t: 646.451, end: 647.853, text: "萧衍饿死在台城" },
  { t: 647.853, end: 648.654, text: "八十六岁" },
  { t: 648.684, end: 650.028, text: "南朝四百八十寺" },
  { t: 650.028, end: 651.371, text: "多少楼台烟雨中" },
  { t: 651.371, end: 652.715, text: "说的就是这时候" },
  { t: 652.745, end: 654.342, text: "五八九年隋军渡江" },
  { t: 654.342, end: 656.537, text: "陈后主带着妃子躲进枯井" },
  { t: 656.567, end: 657.755, text: "被拉出来的时候" },
  { t: 657.755, end: 658.604, text: "南朝结束了" },
  { t: 658.634, end: 660.089, text: "隋朝只活了三十七年" },
  { t: 660.119, end: 662.189, text: "五八一年杨坚代周建隋" },
  { t: 662.189, end: 663.431, text: "五八九年灭陈" },
  { t: 663.461, end: 664.654, text: "他创三省六部" },
  { t: 664.654, end: 665.251, text: "开科举" },
  { t: 665.251, end: 668.036, text: "把选官的权力从门阀手里收回来" },
  { t: 668.066, end: 669.765, text: "开皇年间国库充实" },
  { t: 669.765, end: 672.526, text: "粮仓的粮食吃到唐朝还没吃完" },
  { t: 672.556, end: 674.191, text: "大运河把南北连起来" },
  { t: 674.191, end: 676.371, text: "后来的漕运靠它吃了上千年" },
  { t: 676.401, end: 677.594, text: "但他猜忌心重" },
  { t: 677.594, end: 678.787, text: "废了太子杨勇" },
  { t: 678.787, end: 679.582, text: "改立杨广" },
  { t: 679.612, end: 680.97, text: "六零四年杨广即位" },
  { t: 681.0, end: 682.012, text: "他修大运河" },
  { t: 682.012, end: 683.226, text: "从余杭到涿郡" },
  { t: 683.226, end: 684.238, text: "两千多公里" },
  { t: 684.268, end: 685.703, text: "隋炀帝设进士科" },
  { t: 685.703, end: 688.164, text: "科举从此成了读书人的正路" },
  { t: 688.194, end: 688.998, text: "三征高丽" },
  { t: 688.998, end: 691.812, text: "第一次就出动一百一十三万大军" },
  { t: 691.842, end: 693.352, text: "一支三十万人的队伍" },
  { t: 693.352, end: 694.358, text: "回来不到三千" },
  { t: 694.388, end: 695.387, text: "民力耗尽" },
  { t: 695.387, end: 696.385, text: "天下大乱" },
  { t: 696.415, end: 699.292, text: "六一八年杨广在江都被部下勒死" },
  { t: 699.292, end: 700.114, text: "隋朝灭亡" },
  { t: 700.144, end: 701.559, text: "他死前照镜子" },
  { t: 701.559, end: 702.502, text: "说好头颅" },
  { t: 702.502, end: 703.445, text: "谁当斫之" },
  { t: 703.475, end: 705.508, text: "六一八年李渊在长安称帝" },
  { t: 705.508, end: 706.247, text: "唐朝开始" },
  { t: 706.277, end: 707.773, text: "六二六年玄武门之变" },
  { t: 707.773, end: 710.433, text: "李世民杀了哥哥李建成和弟弟李元吉" },
  { t: 710.463, end: 711.786, text: "他在玄武门埋伏" },
  { t: 711.786, end: 713.109, text: "一箭射死李建成" },
  { t: 713.109, end: 714.81, text: "尉迟敬德杀了李元吉" },
  { t: 714.84, end: 715.989, text: "他逼父亲退位" },
  { t: 715.989, end: 717.903, text: "自己当了二十三年皇帝" },
  { t: 717.903, end: 718.669, text: "年号贞观" },
  { t: 718.699, end: 720.044, text: "纳谏轻徭用人" },
  { t: 720.044, end: 723.183, text: "魏征死了他说自己少了一面镜子" },
  { t: 723.213, end: 723.902, text: "贞观之治" },
  { t: 723.902, end: 726.484, text: "人口从两百万户恢复到三百多万户" },
  { t: 726.514, end: 729.29, text: "有一年全国判死刑的只有二十九个人" },
  { t: 729.32, end: 731.411, text: "周边各族尊他为天可汗" },
  { t: 731.411, end: 732.247, text: "玄奘西行" },
  { t: 732.247, end: 733.502, text: "文成公主入藏" },
  { t: 733.532, end: 735.274, text: "六四九年李世民去世" },
  { t: 735.274, end: 736.436, text: "儿子李治即位" },
  { t: 736.466, end: 738.222, text: "皇后武则天慢慢掌权" },
  { t: 738.222, end: 739.393, text: "六九零年称帝" },
  { t: 739.393, end: 740.369, text: "改国号为周" },
  { t: 740.399, end: 742.363, text: "她是中国历史上唯一的女皇帝" },
  { t: 742.393, end: 743.58, text: "她十四岁进宫" },
  { t: 743.58, end: 744.965, text: "从才人做到皇后" },
  { t: 744.965, end: 747.34, text: "又在皇后位上等了三十五年" },
  { t: 747.37, end: 750.275, text: "十五年里她把唐朝宗室杀得七零八落" },
  { t: 750.305, end: 751.97, text: "也把科举取士推得更广" },
  { t: 751.97, end: 753.302, text: "寒门子弟有了出路" },
  { t: 753.332, end: 754.195, text: "她重用酷吏" },
  { t: 754.195, end: 756.094, text: "也重用狄仁杰这样的能臣" },
  { t: 756.124, end: 757.764, text: "七零五年神龙政变" },
  { t: 757.764, end: 758.789, text: "武则天退位" },
  { t: 758.789, end: 759.609, text: "唐朝复辟" },
  { t: 759.639, end: 761.044, text: "她那年冬天就死了" },
  { t: 761.044, end: 761.746, text: "八十二岁" },
  { t: 761.746, end: 764.029, text: "乾陵前那块无字碑一个字没刻" },
  { t: 764.059, end: 766.627, text: "之后韦后太平公主先后弄权" },
  { t: 766.627, end: 768.981, text: "直到七一二年李隆基即位" },
  { t: 769.011, end: 771.566, text: "七一三到七四一年开元盛世" },
  { t: 771.566, end: 773.269, text: "全国人口约八千万" },
  { t: 773.299, end: 775.796, text: "长安是当时世界上最大的城市" },
  { t: 775.796, end: 777.332, text: "西市里到处是胡商" },
  { t: 777.362, end: 778.928, text: "李白杜甫王维" },
  { t: 778.928, end: 780.755, text: "都活在这个年代" },
  { t: 780.785, end: 782.819, text: "开元年间米价一斗十几文" },
  { t: 782.819, end: 784.484, text: "路上掉了东西没人捡" },
  { t: 784.514, end: 785.867, text: "但盛世底下埋着雷" },
  { t: 785.897, end: 787.034, text: "府兵制瓦解" },
  { t: 787.034, end: 787.716, text: "改募兵" },
  { t: 787.746, end: 789.475, text: "节度使权力越来越大" },
  { t: 789.475, end: 790.82, text: "边疆十大节度使" },
  { t: 790.82, end: 791.973, text: "兵力四十九万" },
  { t: 792.003, end: 795.761, text: "安禄山一个人就管着范阳平卢河东三" },
  { t: 795.761, end: 795.996, text: "镇" },
  { t: 795.996, end: 796.936, text: "十八万兵" },
  { t: 796.966, end: 799.199, text: "七五五年安禄山在范阳起兵" },
  { t: 799.199, end: 800.316, text: "安史之乱爆发" },
  { t: 800.346, end: 801.786, text: "叛军一路南下" },
  { t: 801.786, end: 803.707, text: "洛阳长安先后失守" },
  { t: 803.737, end: 805.231, text: "玄宗逃到马嵬坡" },
  { t: 805.231, end: 806.086, text: "禁军哗变" },
  { t: 806.086, end: 807.58, text: "他赐死了杨贵妃" },
  { t: 807.61, end: 809.508, text: "太子李亨在灵武即位" },
  { t: 809.508, end: 811.828, text: "靠郭子仪李光弼苦苦支撑" },
  { t: 811.858, end: 813.517, text: "安禄山后来被儿子杀掉" },
  { t: 813.517, end: 815.01, text: "史思明又被儿子杀掉" },
  { t: 815.04, end: 816.537, text: "八年之后叛乱平定" },
  { t: 816.537, end: 818.034, text: "唐朝再也回不去了" },
  { t: 818.064, end: 819.062, text: "安史之乱后" },
  { t: 819.062, end: 821.258, text: "登记的户口只剩三分之一" },
  { t: 821.288, end: 823.759, text: "藩镇割据宦官专权党争" },
  { t: 823.759, end: 824.995, text: "一个接一个" },
  { t: 825.025, end: 826.477, text: "皇帝由宦官拥立" },
  { t: 826.477, end: 828.344, text: "有的皇帝想除掉宦官" },
  { t: 828.344, end: 829.588, text: "反被宦官杀掉" },
  { t: 829.618, end: 831.14, text: "八三五年甘露之变" },
  { t: 831.14, end: 832.853, text: "宦官杀了几百名朝臣" },
  { t: 832.883, end: 834.43, text: "八七五年黄巢起义" },
  { t: 834.43, end: 835.591, text: "八八四年失败" },
  { t: 835.621, end: 838.047, text: "九零七年朱温废掉唐哀帝" },
  { t: 838.047, end: 838.929, text: "唐朝灭亡" },
  { t: 838.959, end: 840.437, text: "九零七到九六零年" },
  { t: 840.437, end: 841.175, text: "五十三年" },
  { t: 841.175, end: 842.653, text: "中原换了五个朝代" },
  { t: 842.683, end: 843.757, text: "十四个皇帝" },
  { t: 843.757, end: 844.401, text: "八个姓" },
  { t: 844.401, end: 846.334, text: "谁兵强马壮谁当皇帝" },
  { t: 846.364, end: 847.675, text: "五代的宰相冯道" },
  { t: 847.675, end: 849.361, text: "前后伺候过十个皇帝" },
  { t: 849.361, end: 850.297, text: "自称长乐老" },
  { t: 850.327, end: 851.828, text: "李存勖灭梁建后唐" },
  { t: 851.828, end: 852.954, text: "打了十五年仗" },
  { t: 852.954, end: 854.831, text: "当皇帝三年就死于兵变" },
  { t: 854.861, end: 857.015, text: "石敬瑭割燕云十六州给契丹" },
  { t: 857.015, end: 857.913, text: "当了儿皇帝" },
  { t: 857.943, end: 858.988, text: "这片地一丢" },
  { t: 858.988, end: 861.496, text: "中原的北大门四百年没关上" },
  { t: 861.526, end: 863.258, text: "九五四年柴荣即位" },
  { t: 863.258, end: 864.991, text: "整顿军队清查田亩" },
  { t: 865.021, end: 866.018, text: "他北伐辽国" },
  { t: 866.018, end: 868.013, text: "四十二天收复三关三州" },
  { t: 868.043, end: 868.827, text: "柴荣说" },
  { t: 868.827, end: 870.133, text: "给他三十年" },
  { t: 870.133, end: 871.178, text: "十年开拓" },
  { t: 871.178, end: 872.223, text: "十年养民" },
  { t: 872.223, end: 873.268, text: "十年太平" },
  { t: 873.298, end: 874.755, text: "他才做了五年半" },
  { t: 874.755, end: 875.587, text: "就病死了" },
  { t: 875.587, end: 876.42, text: "三十九岁" },
  { t: 876.45, end: 877.076, text: "十国里" },
  { t: 877.076, end: 878.329, text: "南唐李煜写词" },
  { t: 878.329, end: 879.79, text: "后蜀孟昶修宫殿" },
  { t: 879.79, end: 881.877, text: "都是乱世里的一点斯文" },
  { t: 881.907, end: 883.326, text: "九五九年柴荣病逝" },
  { t: 883.326, end: 884.568, text: "七岁的儿子即位" },
  { t: 884.598, end: 887.021, text: "九六零年赵匡胤陈桥兵变" },
  { t: 887.021, end: 887.902, text: "黄袍加身" },
  { t: 887.902, end: 888.783, text: "建立宋朝" },
  { t: 888.813, end: 889.975, text: "赵匡胤当皇帝" },
  { t: 889.975, end: 891.525, text: "第一件事是收兵权" },
  { t: 891.555, end: 893.809, text: "九六一年杯酒释兵权" },
  { t: 893.809, end: 896.313, text: "将领交出兵权回家养老" },
  { t: 896.343, end: 897.549, text: "他定下规矩" },
  { t: 897.549, end: 899.479, text: "重文抑武强干弱枝" },
  { t: 899.509, end: 900.726, text: "兵权归枢密院" },
  { t: 900.726, end: 901.74, text: "统兵归三衙" },
  { t: 901.74, end: 903.566, text: "调兵和统兵分成两套" },
  { t: 903.596, end: 905.316, text: "地方精锐编入禁军" },
  { t: 905.316, end: 906.176, text: "轮番戍边" },
  { t: 906.176, end: 907.896, text: "将领带的是陌生兵" },
  { t: 907.926, end: 909.474, text: "科举取士人数大增" },
  { t: 909.474, end: 911.022, text: "文官地位高过武将" },
  { t: 911.052, end: 913.384, text: "宋朝的商业和城市经济很发达" },
  { t: 913.384, end: 915.358, text: "交子是世界上最早的纸币" },
  { t: 915.388, end: 917.736, text: "《清明上河图》画的就是汴京的繁华" },
  { t: 917.766, end: 919.478, text: "汴京的夜市三更才散" },
  { t: 919.478, end: 920.239, text: "五更又开" },
  { t: 920.269, end: 922.022, text: "宋朝养了上百万禁军" },
  { t: 922.022, end: 923.775, text: "军费占了财政的大半" },
  { t: 923.805, end: 924.818, text: "钱花了不少" },
  { t: 924.818, end: 926.033, text: "仗还是打不赢" },
  { t: 926.063, end: 927.935, text: "这套办法防住了内部叛乱" },
  { t: 927.935, end: 929.636, text: "也让宋朝对外一直偏软" },
  { t: 929.666, end: 931.778, text: "一零零四年辽军南下" },
  { t: 931.778, end: 932.716, text: "澶渊之盟" },
  { t: 932.746, end: 933.889, text: "宋真宗亲征" },
  { t: 933.889, end: 935.717, text: "寇准把他推到城头" },
  { t: 935.747, end: 938.725, text: "宋朝每年给辽银十万两绢二十万匹" },
  { t: 938.725, end: 940.313, text: "换来一百多年和平" },
  { t: 940.343, end: 942.698, text: "一零六九年王安石变法" },
  { t: 942.698, end: 945.289, text: "青苗法募役法方田均税法" },
  { t: 945.319, end: 947.191, text: "想解决财政和军事问题" },
  { t: 947.191, end: 948.314, text: "结果引发党争" },
  { t: 948.344, end: 950.011, text: "新法旧法来回折腾" },
  { t: 950.011, end: 951.886, text: "一直折腾到北宋灭亡" },
  { t: 951.916, end: 954.283, text: "一一二七年金军攻破汴京" },
  { t: 954.283, end: 955.574, text: "徽钦二帝被掳" },
  { t: 955.574, end: 956.435, text: "北宋灭亡" },
  { t: 956.465, end: 957.834, text: "史称靖康之变" },
  { t: 957.834, end: 960.8, text: "后妃宗室三千多人被押往北方" },
  { t: 960.83, end: 962.365, text: "北宋一百六十七年" },
  { t: 962.365, end: 964.092, text: "攒下的财富全被抢空" },
  { t: 964.122, end: 966.831, text: "同年赵构在南京应天府称帝" },
  { t: 966.831, end: 967.734, text: "南宋开始" },
  { t: 967.764, end: 969.54, text: "一一三八年定都临安" },
  { t: 969.57, end: 971.255, text: "南宋的皇帝多半偏安" },
  { t: 971.255, end: 972.191, text: "北伐喊得响" },
  { t: 972.191, end: 973.502, text: "真打起来又议和" },
  { t: 973.532, end: 975.657, text: "一一四二年岳飞被杀" },
  { t: 975.657, end: 976.601, text: "宋金议和" },
  { t: 976.631, end: 978.58, text: "岳飞死前留下八个字" },
  { t: 978.58, end: 979.446, text: "天日昭昭" },
  { t: 979.446, end: 980.312, text: "天日昭昭" },
  { t: 980.342, end: 982.184, text: "一二七九年崖山海战" },
  { t: 982.184, end: 984.844, text: "陆秀夫背着八岁的小皇帝跳海" },
  { t: 984.874, end: 985.772, text: "南宋灭亡" },
  { t: 985.802, end: 988.923, text: "一二七一年忽必烈定国号为元" },
  { t: 988.953, end: 990.884, text: "一二七九年灭南宋" },
  { t: 990.884, end: 991.85, text: "统一天下" },
  { t: 991.88, end: 993.715, text: "成吉思汗先统一蒙古" },
  { t: 993.715, end: 994.938, text: "西征打到中亚" },
  { t: 994.968, end: 995.796, text: "忽必烈建元" },
  { t: 995.796, end: 997.949, text: "把草原帝国改成一个中原王朝" },
  { t: 997.979, end: 998.882, text: "他定都大都" },
  { t: 998.882, end: 1000.326, text: "也就是今天的北京" },
  { t: 1000.356, end: 1002.03, text: "元朝把人分成四等" },
  { t: 1002.03, end: 1004.122, text: "蒙古人色目人汉人南人" },
  { t: 1004.152, end: 1005.915, text: "行省制度从这时候开始" },
  { t: 1005.915, end: 1006.973, text: "一直用到今天" },
  { t: 1007.003, end: 1008.344, text: "元曲在勾栏里唱" },
  { t: 1008.344, end: 1011.025, text: "关汉卿马致远都是这个时代的人" },
  { t: 1011.055, end: 1012.013, text: "九十八年" },
  { t: 1012.013, end: 1013.211, text: "十一位皇帝" },
  { t: 1013.241, end: 1014.141, text: "黄河泛滥" },
  { t: 1014.141, end: 1015.267, text: "红巾军起义" },
  { t: 1015.267, end: 1016.167, text: "天下大乱" },
  { t: 1016.197, end: 1018.577, text: "一三六八年明军攻入大都" },
  { t: 1018.577, end: 1019.443, text: "元朝灭亡" },
  { t: 1019.473, end: 1021.246, text: "残余势力退回草原" },
  { t: 1021.276, end: 1024.065, text: "一三六八年朱元璋在应天称帝" },
  { t: 1024.065, end: 1024.709, text: "国号明" },
  { t: 1024.739, end: 1027.052, text: "他是放牛娃和尚乞丐" },
  { t: 1027.082, end: 1028.839, text: "二十四岁参加红巾军" },
  { t: 1028.839, end: 1030.011, text: "四十岁当皇帝" },
  { t: 1030.011, end: 1030.987, text: "用了十六年" },
  { t: 1031.017, end: 1032.16, text: "他废了丞相" },
  { t: 1032.16, end: 1033.075, text: "设锦衣卫" },
  { t: 1033.105, end: 1034.609, text: "太监有二十四衙门" },
  { t: 1034.609, end: 1036.677, text: "司礼监后来能替皇帝批红" },
  { t: 1036.707, end: 1038.288, text: "杀了胡惟庸蓝玉" },
  { t: 1038.288, end: 1039.643, text: "几万人受牵连" },
  { t: 1039.673, end: 1040.995, text: "空印案郭桓案" },
  { t: 1040.995, end: 1042.317, text: "又杀了几万人" },
  { t: 1042.347, end: 1043.636, text: "他给子孙定规矩" },
  { t: 1043.636, end: 1044.741, text: "不许宦官干政" },
  { t: 1044.741, end: 1045.846, text: "不许再设丞相" },
  { t: 1045.876, end: 1047.106, text: "可他死后没几年" },
  { t: 1047.106, end: 1048.16, text: "这两条都破了" },
  { t: 1048.19, end: 1050.822, text: "一三九九年燕王朱棣起兵靖难" },
  { t: 1050.852, end: 1052.654, text: "一四零二年攻入南京" },
  { t: 1052.654, end: 1054.056, text: "建文帝下落不明" },
  { t: 1054.086, end: 1055.433, text: "朱棣迁都北京" },
  { t: 1055.433, end: 1056.555, text: "修永乐大典" },
  { t: 1056.555, end: 1058.126, text: "派郑和七下西洋" },
  { t: 1058.156, end: 1059.731, text: "郑和第一次下西洋" },
  { t: 1059.731, end: 1060.912, text: "六十二艘宝船" },
  { t: 1060.912, end: 1062.093, text: "两万七千多人" },
  { t: 1062.123, end: 1063.808, text: "船队最远到了非洲东岸" },
  { t: 1063.838, end: 1065.397, text: "后来朝廷转向海禁" },
  { t: 1065.397, end: 1066.567, text: "片板不许下海" },
  { t: 1066.567, end: 1068.711, text: "大航海时代就这么错过了" },
  { t: 1068.741, end: 1069.701, text: "明朝中后期" },
  { t: 1069.701, end: 1071.236, text: "美洲白银大量流入" },
  { t: 1071.236, end: 1073.348, text: "银子成了市面上的硬通货" },
  { t: 1073.378, end: 1075.261, text: "一四四九年土木堡之变" },
  { t: 1075.261, end: 1076.579, text: "英宗被瓦剌俘虏" },
  { t: 1076.609, end: 1078.134, text: "于谦在北京另立新君" },
  { t: 1078.134, end: 1079.49, text: "打赢了北京保卫战" },
  { t: 1079.52, end: 1080.829, text: "后来英宗复辟" },
  { t: 1080.829, end: 1081.701, text: "于谦被杀" },
  { t: 1081.731, end: 1083.398, text: "一五二一年嘉靖即位" },
  { t: 1083.398, end: 1085.25, text: "一个大礼议就吵了三年" },
  { t: 1085.28, end: 1086.581, text: "他二十多年不上朝" },
  { t: 1086.611, end: 1087.809, text: "他在宫里炼丹" },
  { t: 1087.809, end: 1089.206, text: "差点被宫女勒死" },
  { t: 1089.206, end: 1090.404, text: "史称壬寅宫变" },
  { t: 1090.434, end: 1092.515, text: "一五七二年万历即位" },
  { t: 1092.515, end: 1094.364, text: "前十年张居正改革" },
  { t: 1094.394, end: 1096.689, text: "一条鞭法把赋役折成银子" },
  { t: 1096.689, end: 1097.941, text: "国库一度充盈" },
  { t: 1097.971, end: 1099.259, text: "后三十多年怠政" },
  { t: 1099.259, end: 1100.915, text: "国本之争闹了十五年" },
  { t: 1100.945, end: 1102.835, text: "一六一八年萨尔浒之战" },
  { t: 1102.835, end: 1103.968, text: "明军四路出击" },
  { t: 1103.968, end: 1105.102, text: "三路全军覆没" },
  { t: 1105.132, end: 1106.933, text: "一六二零年天启即位" },
  { t: 1106.933, end: 1107.933, text: "魏忠贤专权" },
  { t: 1107.963, end: 1109.425, text: "一六二七年崇祯即位" },
  { t: 1109.425, end: 1111.536, text: "十七年换了五十个内阁大学士" },
  { t: 1111.566, end: 1113.847, text: "杀了七个总督十一个巡抚" },
  { t: 1113.877, end: 1115.032, text: "他勤政节俭" },
  { t: 1115.032, end: 1118.035, text: "可国库空虚党争不止天灾不断" },
  { t: 1118.065, end: 1119.631, text: "小冰期连年大旱" },
  { t: 1119.631, end: 1121.421, text: "陕西河南饿殍遍野" },
  { t: 1121.451, end: 1123.806, text: "一六四四年李自成攻入北京" },
  { t: 1123.806, end: 1125.18, text: "崇祯在煤山自缢" },
  { t: 1125.21, end: 1126.801, text: "明朝二百七十六年" },
  { t: 1126.801, end: 1127.795, text: "十六个皇帝" },
  { t: 1127.795, end: 1128.591, text: "明朝灭亡" },
  { t: 1128.621, end: 1130.477, text: "一六四四年清军入关" },
  { t: 1130.507, end: 1132.414, text: "中原已经在李自成手里" },
  { t: 1132.414, end: 1133.94, text: "吴三桂打开山海关" },
  { t: 1133.94, end: 1135.084, text: "清军顺势进来" },
  { t: 1135.114, end: 1137.219, text: "顺治是入关后的第一个皇帝" },
  { t: 1137.219, end: 1138.447, text: "二十四岁就死了" },
  { t: 1138.477, end: 1140.656, text: "一六六一年康熙即位" },
  { t: 1140.656, end: 1141.14, text: "八岁" },
  { t: 1141.14, end: 1142.35, text: "十四岁亲政" },
  { t: 1142.38, end: 1143.697, text: "十六岁除鳌拜" },
  { t: 1143.697, end: 1145.015, text: "二十岁平三藩" },
  { t: 1145.015, end: 1146.332, text: "三十岁收台湾" },
  { t: 1146.362, end: 1148.157, text: "三十六岁签尼布楚条约" },
  { t: 1148.157, end: 1150.312, text: "把黑龙江以东的边界定下来" },
  { t: 1150.342, end: 1151.915, text: "他三次亲征噶尔丹" },
  { t: 1151.915, end: 1153.095, text: "把漠北收进来" },
  { t: 1153.125, end: 1154.696, text: "他学几何学天文" },
  { t: 1154.696, end: 1156.491, text: "让传教士进宫讲课" },
  { t: 1156.521, end: 1157.336, text: "到他晚年" },
  { t: 1157.336, end: 1159.983, text: "外蒙古和西藏都归了清朝管辖" },
  { t: 1160.013, end: 1161.151, text: "他在位六十一年" },
  { t: 1161.151, end: 1162.939, text: "是历史上在位最长的皇帝" },
  { t: 1162.969, end: 1164.957, text: "一七二二年雍正即位" },
  { t: 1164.957, end: 1165.619, text: "十三年" },
  { t: 1165.649, end: 1167.137, text: "九子夺嫡的赢家" },
  { t: 1167.137, end: 1168.837, text: "一上台就收拾兄弟" },

/* ---------------- build ---------------- */
let tl = null;

function buildStage() {
  document.getElementById("stage").innerHTML = PaperCut.buildStage(SHOTS);
}

function buildCaptions() {
  const wrap = document.getElementById("caption-wrap");
  wrap.innerHTML = "";
  CAPS.forEach((s, i) => {
    const line = document.createElement("div");
    line.className = "cap-line";
    line.id = "cap-" + i;
    const box = document.createElement("span");
    box.className = "cap-box";
    box.textContent = s.text;
    line.appendChild(box);
    wrap.appendChild(line);
  });
}

function cameraOf(shot) {
  const c = shot.camera || {};
  const from = c.from || { x: 0, y: 0, scale: 1.02, rot: 0 };
  const to = c.to || { x: 0, y: 0, scale: 1.10, rot: 0 };
  return { from, to };
}

/* 人物：跑步的起伏与摆臂摆腿、披风、主角动作（挥刺 / 拉弓 / 举剑 / 后坐） */
function animateLife(el, shot, t0, dur) {
  const chars = shot.chars || [];
  const persons = el.querySelectorAll(".pc-chars .pc-person-wrap");

  persons.forEach((w, i) => {
    const c = chars[i] || {};
    const role = c.role || "official";
    const pose = c.pose || "stand";
    const dir = c.facing === "left" ? -1 : 1;
    const moving = pose === "run" || pose === "walk";

    const breath = w.querySelectorAll(".pc-breathe");
    const armL = w.querySelectorAll(".pc-arm-l");
    const armR = w.querySelectorAll(".pc-arm-r");
    const legL = w.querySelectorAll(".pc-leg-l");
    const legR = w.querySelectorAll(".pc-leg-r");
    const capeL = w.querySelectorAll(".pc-cape-l");
    const capeR = w.querySelectorAll(".pc-cape-r");

    /* 每个人的步频与相位错开，避免多人同拍像队列 */
    const amp = pose === "run" ? 7 : pose === "walk" ? 4 : 2.2;
    const cycle = (pose === "run" ? .18 : pose === "walk" ? .3 : 1.2) * (1 + (i % 3) * .07);
    const ph = .06 + i * .093;
    const reps = Math.max(2, 2 * Math.floor(dur / (cycle * 2)));

    breath.forEach((b, k) => {
      tl.fromTo(b, { y: 0 }, { y: -amp, duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
        t0 + ph + k * .02);
    });

    if (moving) {
      tl.fromTo(w, { x: 0 }, { x: dir * (pose === "run" ? 26 : 14), duration: dur, ease: "sine.inOut" }, t0);
      const swing = (pose === "run" ? 14 : 8) * (role === "soldier" ? 1.1 : 1);
      /* 切镜即动：靠反向起步与各自步频错开，而不是延后起摆 */
      const s0 = i % 2 ? -1 : 1;
      [[legL, -14, 1], [legR, 14, -1]].forEach(([gs, ox, sgn]) => {
        gs.forEach((g, k) => {
          const base = gsap.getProperty(g, "rotation") || 0;
          tl.fromTo(g, { rotation: base - swing * sgn * s0, svgOrigin: ox + " -44" },
            { rotation: base + swing * sgn * s0, svgOrigin: ox + " -44", duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
            t0 + .02 + k * .01);
        });
      });
      [[armL, -19, -1], [armR, 19, 1]].forEach(([gs, ox, sgn]) => {
        gs.forEach((g) => {
          const base = gsap.getProperty(g, "rotation") || 0;
          tl.fromTo(g, { rotation: base - swing * .55 * sgn * s0, svgOrigin: ox + " -130" },
            { rotation: base + swing * .55 * sgn * s0, svgOrigin: ox + " -130", duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
            t0 + .02);
        });
      });
    } else {
      armL.forEach((g) => {
        const base = gsap.getProperty(g, "rotation") || 0;
        tl.fromTo(g, { rotation: base }, { rotation: base + 1.3 * dir, svgOrigin: "-19 -130", duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 1.7)) }, t0 + .2);
      });
      armR.forEach((g) => {
        const base = gsap.getProperty(g, "rotation") || 0;
        tl.fromTo(g, { rotation: base }, { rotation: base - 1.1 * dir, svgOrigin: "19 -130", duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 2.1)) }, t0 + .3);
      });
    }

    capeL.forEach((p) => tl.fromTo(p, { scaleX: 1 }, { scaleX: 1.12, transformOrigin: "100% 30%", duration: .7, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 1.4)) }, t0 + .1));
    capeR.forEach((p) => tl.fromTo(p, { scaleX: 1 }, { scaleX: 1.1, transformOrigin: "0% 30%", duration: .82, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 1.64)) }, t0 + .1));

    /* 主角动作：按镜头设计 */
    if (role !== "general") return;
    if (shot.id === "r001") {
      [[1.02], [3.06]].forEach(([tt]) => {
        tl.to(w, { x: -12, duration: .24, ease: "power2.in" }, t0 + tt)
          .to(w, { x: 30, duration: .14, ease: "power4.out" }, t0 + tt + .24)
          .to(w, { x: 0, duration: .82, ease: "power2.inOut" }, t0 + tt + .38);
        tl.fromTo("#stage", { x: 0 }, { x: 7, duration: .05, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt + .27);
      });
    } else if (shot.id === "r002") {
      [.9, 2.7].forEach((tt) => {
        tl.fromTo(w, { scale: 1 }, { scale: 1.035, duration: .2, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt);
      });
    } else if (shot.id === "r003") {
      tl.fromTo(w, { y: 0, rotation: 0 }, { y: -6, rotation: -1.2, duration: 1.5, ease: "sine.out" }, t0 + .5);
      tl.to(w, { y: 0, rotation: 0, duration: 2.6, ease: "sine.inOut" }, t0 + 2.2);
    } else if (shot.id === "r004") {
      tl.to(w, { x: -9, duration: 1.25, ease: "sine.out" }, t0 + .35);
      tl.to(w, { x: 12, duration: .1, ease: "power4.out" }, t0 + 1.68);
      tl.to(w, { x: 0, duration: .95, ease: "power2.out" }, t0 + 1.78);
      tl.fromTo("#stage", { x: 0 }, { x: 9, duration: .055, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + 1.7);
    } else if (shot.id === "r005") {
      [1.15, 3.45].forEach((tt) => {
        tl.to(w, { x: 9, duration: .07, ease: "power3.out" }, t0 + tt)
          .to(w, { x: 0, duration: .55, ease: "power2.out" }, t0 + tt + .07);
        tl.fromTo("#stage", { x: 0 }, { x: 10, duration: .06, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt);
      });
    }
  });
}

/* 开场钩子：标题砸屏后 1 秒抖屏，振幅按 1.6 次方衰减到 0 */
function hookShake(el, t0, dur, amp) {
  const n = Math.round(dur * 30);
  for (let k = 0; k <= n; k++) {
    const tt = k / 30;
    const env = Math.pow(1 - tt / dur, 1.6);
    const dx = Math.sin(tt * 11 * 2 * Math.PI) * amp * env;
    const dy = Math.sin(tt * 7.3 * 2 * Math.PI) * amp * .6 * env;
    tl.set(el, { x: dx, y: dy }, t0 + tt);
  }
}

function buildTimeline() {
  const rootDur = parseFloat(document.getElementById("root").dataset.duration) || 0;
  const total = Math.max(CUE.filmEnd || 0, rootDur, SHOTS.length ? SHOTS[SHOTS.length - 1].t1 + 5.4 : 5.4);
  tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

  gsap.set(".shot", { autoAlpha: 0 });

  SHOTS.forEach((shot, i) => {
    const el = document.querySelectorAll("#stage .shot")[i];
    if (!el) return;
    const t0 = Number(shot.t0) || 0;
    const t1 = Number(shot.t1) || t0 + 3.5;
    const dur = Math.max(0.4, t1 - t0);
    const world = el.querySelector(".shot-world");
    const cam = cameraOf(shot);
    const ease = shot.camera && shot.camera.ease ? shot.camera.ease : "sine.inOut";
    const hook = !!shot.hook;

    tl.set(el, { autoAlpha: 1 }, t0);

    /* 运镜：两段式（推进 → 收束），缩放走对数空间，速度变化不顿挫 */
    const cf = cam.from, ct = cam.to;
    const cs = (a, b, r) => Math.exp(Math.log(a) * (1 - r) + Math.log(b) * r);
    const mid = {
      x: (cf.x || 0) + ((ct.x || 0) - (cf.x || 0)) * .58,
      y: (cf.y || 0) + ((ct.y || 0) - (cf.y || 0)) * .58,
      scale: cs(cf.scale || 1.02, ct.scale || 1.10, .58),
      rotation: (cf.rot || 0) + ((ct.rot || 0) - (cf.rot || 0)) * .58
    };
    tl.fromTo(world,
      { x: cf.x || 0, y: cf.y || 0, scale: cf.scale || 1.02, rotation: cf.rot || 0 },
      { x: mid.x, y: mid.y, scale: mid.scale, rotation: mid.rotation, duration: dur * .58, ease: "power1.inOut" }, t0);
    tl.to(world,
      { x: ct.x || 0, y: ct.y || 0, scale: ct.scale || 1.10, rotation: ct.rot || 0, duration: dur * .42, ease },
      t0 + dur * .58);

    if (hook) {
      /* 钩子：各层从下方砸入，落定后抖屏 1 秒 */
      [
        [".pc-sky", -22, 1.05, 0],
        [".pc-far", 26, 1.04, .02],
        [".pc-mid", 64, 1.10, .04],
        [".pc-action", 96, 1.14, .06],
        [".pc-fore", 26, 1.04, .08]
      ].forEach(([sel, y0, s0, delay]) => {
        const layer = el.querySelector(sel);
        if (!layer) return;
        tl.fromTo(layer, { x: 0, y: y0, scale: s0, transformOrigin: "50% 82%" },
          { x: 0, y: 0, scale: 1, duration: .52, ease: "power4.out" }, t0 + delay);
      });
      hookShake(el, t0, 1.0, 14);
      tl.fromTo("#hook-flash", { opacity: 0 }, { opacity: .95, duration: .04, ease: "none" }, t0);
      tl.to("#hook-flash", { opacity: 0, duration: .32, ease: "power2.out" }, t0 + .05);
      tl.fromTo("#hook-ring", { opacity: 0, scale: .32 }, { opacity: .85, scale: 1, duration: .16, ease: "power4.out" }, t0 + .03);
      tl.to("#hook-ring", { opacity: 0, scale: 1.55, duration: .44, ease: "power2.out" }, t0 + .20);
    } else {
      /* 手持浮动：整镜极轻微漂移，去掉三脚架感 */
      const hs = i % 2 ? 1 : -1;
      tl.fromTo(el, { x: 0, y: 0 }, { x: hs * 5, y: -3 - (i % 3), duration: dur, ease: "sine.inOut" }, t0);

      /* 层间视差：远景慢、近景快 */
      el.querySelectorAll(".pc-layer").forEach((layer, j) => {
        const depth = parseFloat(layer.dataset.depth || "1");
        const drift = (j % 2 ? 1 : -1) * (12 + depth * 22);
        tl.fromTo(layer, { x: -drift * .55, y: -6 }, { x: drift, y: 9, duration: dur, ease: "sine.inOut" }, t0);
      });
    }

    animateLife(el, shot, t0, dur);
    animateEnvironment(el, shot, t0, dur);

    /* 标题 */
    const title = el.querySelector(".shot-title");
    if (title) {
      if (hook) {
        tl.set(title, { xPercent: -50 }, t0);
        tl.fromTo(title, { opacity: 0, y: 62, scale: 1.52 },
          { opacity: 1, y: 0, scale: 1, duration: .27, ease: "power4.out" }, t0 + .02);
        tl.fromTo(title, { scale: 1 }, { scale: 1.032, duration: .42, ease: "power2.out" }, t0 + .30);
        tl.to(title, { scale: 1, duration: .55, ease: "sine.inOut" }, t0 + .72);
        const kick = title.querySelector(".tc-kicker");
        const sub = title.querySelector(".tc-sub");
        if (kick) {
          tl.set(kick, { opacity: 0 }, t0);
          tl.fromTo(kick, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .32, ease: "power3.out" }, t0 + .20);
        }
        if (sub) {
          tl.set(sub, { opacity: 0 }, t0);
          tl.fromTo(sub, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .36, ease: "power3.out" }, t0 + .36);
        }
        tl.to(title, { opacity: 0, y: -26, duration: .38, ease: "power2.in" }, Math.max(t0 + .5, t1 - .46));
      } else {
        tl.fromTo(title, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, t0 + .12);
        tl.to(title, { opacity: 0, y: -18, duration: .38, ease: "power2.in" }, Math.max(t0 + .5, t1 - .48));
      }
    }

    /* 纸片转场：章节切换或显式声明 */
    if (shot.wipe) {
      tl.set("#paper-wipe", { visibility: "visible" }, Math.max(0, t0 - .22));
      tl.fromTo("#paper-wipe", { xPercent: -105 }, { xPercent: 105, duration: .44, ease: "power2.inOut" }, Math.max(0, t0 - .22));
      tl.set("#paper-wipe", { visibility: "hidden" }, t0 + .24);
    }

    tl.set(el, { autoAlpha: 0 }, t1);
  });

  /* 字幕 */
  CAPS.forEach((s, i) => {
    const el = document.getElementById("cap-" + i);
    if (!el) return;
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .01, ease: "none" }, s.t);
    tl.to(el, { opacity: 0, duration: .01, ease: "none" }, Math.max(s.t + .12, s.end - .04));
  });

  /* 光扫 */
  tl.fromTo("#light-sweep", { xPercent: -22, opacity: .18 }, { xPercent: 22, opacity: .42, duration: 7, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(total / 7) }, 0);

  /* 片尾 */
  const endAt = total - 5.4;
  if (endAt > 0) {
    tl.to("#stage, #caption-wrap, #subtitle-veil, #vignette", { opacity: 0, duration: .7 }, endAt);
    tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.inOut" }, endAt + .15);
    tl.fromTo(".ec-seal", { opacity: 0, scale: 1.3, rotation: -16 }, { opacity: 1, scale: 1, rotation: -6, duration: .6, ease: "back.out(2)" }, endAt + .35);
    tl.fromTo(".ec-kicker, .ec-title, .ec-sub, .ec-next, .ec-brand", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .65, stagger: .14 }, endAt + .55);
  }

  window.__timelines["china-emperors-20min"] = tl;
}

buildStage();
buildCaptions();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(buildTimeline).catch(buildTimeline);
} else {
  buildTimeline();
}
  </script>
</body>
</html>
