/* ---------------- build ---------------- */
let tl = null;

function buildStage() {
  document.getElementById("stage").innerHTML = PaperCut.buildStage(SHOTS);
}

function buildCaptions() {
  const wrap = document.getElementById("caption-wrap");
  wrap.innerHTML = "";
  CAPS.forEach((s, i) => {
    const line = document.createElement("div");
    line.className = "cap-line";
    line.id = "cap-" + i;
    const box = document.createElement("span");
    box.className = "cap-box";
    box.textContent = s.text;
    line.appendChild(box);
    wrap.appendChild(line);
  });
}

function cameraOf(shot) {
  const c = shot.camera || {};
  const from = c.from || { x: 0, y: 0, scale: 1.02, rot: 0 };
  const to = c.to || { x: 0, y: 0, scale: 1.10, rot: 0 };
  return { from, to };
}

/* 人物：跑步的起伏与摆臂摆腿、披风、主角动作（挥刺 / 拉弓 / 举剑 / 后坐） */
function animateLife(el, shot, t0, dur) {
  const chars = shot.chars || [];
  const persons = el.querySelectorAll(".pc-chars .pc-person-wrap");

  persons.forEach((w, i) => {
    const c = chars[i] || {};
    const role = c.role || "official";
    const pose = c.pose || "stand";
    const dir = c.facing === "left" ? -1 : 1;
    const moving = pose === "run" || pose === "walk";

    const breath = w.querySelectorAll(".pc-breathe");
    const armL = w.querySelectorAll(".pc-arm-l");
    const armR = w.querySelectorAll(".pc-arm-r");
    const legL = w.querySelectorAll(".pc-leg-l");
    const legR = w.querySelectorAll(".pc-leg-r");
    const capeL = w.querySelectorAll(".pc-cape-l");
    const capeR = w.querySelectorAll(".pc-cape-r");

    /* 每个人的步频与相位错开，避免多人同拍像队列 */
    const amp = pose === "run" ? 7 : pose === "walk" ? 4 : 2.2;
    const cycle = (pose === "run" ? .18 : pose === "walk" ? .3 : 1.2) * (1 + (i % 3) * .07);
    const ph = .06 + i * .093;
    const reps = Math.max(2, 2 * Math.floor(dur / (cycle * 2)));

    breath.forEach((b, k) => {
      tl.fromTo(b, { y: 0 }, { y: -amp, duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
        t0 + ph + k * .02);
    });

    if (moving) {
      tl.fromTo(w, { x: 0 }, { x: dir * (pose === "run" ? 26 : 14), duration: dur, ease: "sine.inOut" }, t0);
      const swing = (pose === "run" ? 14 : 8) * (role === "soldier" ? 1.1 : 1);
      /* 切镜即动：靠反向起步与各自步频错开，而不是延后起摆 */
      const s0 = i % 2 ? -1 : 1;
      [[legL, -14, 1], [legR, 14, -1]].forEach(([gs, ox, sgn]) => {
        gs.forEach((g, k) => {
          const base = gsap.getProperty(g, "rotation") || 0;
          tl.fromTo(g, { rotation: base - swing * sgn * s0, svgOrigin: ox + " -44" },
            { rotation: base + swing * sgn * s0, svgOrigin: ox + " -44", duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
            t0 + .02 + k * .01);
        });
      });
      [[armL, -19, -1], [armR, 19, 1]].forEach(([gs, ox, sgn]) => {
        gs.forEach((g) => {
          const base = gsap.getProperty(g, "rotation") || 0;
          tl.fromTo(g, { rotation: base - swing * .55 * sgn * s0, svgOrigin: ox + " -130" },
            { rotation: base + swing * .55 * sgn * s0, svgOrigin: ox + " -130", duration: cycle, ease: "sine.inOut", yoyo: true, repeat: reps },
            t0 + .02);
        });
      });
    } else {
      armL.forEach((g) => {
        const base = gsap.getProperty(g, "rotation") || 0;
        tl.fromTo(g, { rotation: base }, { rotation: base + 1.3 * dir, svgOrigin: "-19 -130", duration: 1.7, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 1.7)) }, t0 + .2);
      });
      armR.forEach((g) => {
        const base = gsap.getProperty(g, "rotation") || 0;
        tl.fromTo(g, { rotation: base }, { rotation: base - 1.1 * dir, svgOrigin: "19 -130", duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / 2.1)) }, t0 + .3);
      });
    }

    capeL.forEach((p) => tl.fromTo(p, { scaleX: 1 }, { scaleX: 1.12, transformOrigin: "100% 30%", duration: .7, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 1.4)) }, t0 + .1));
    capeR.forEach((p) => tl.fromTo(p, { scaleX: 1 }, { scaleX: 1.1, transformOrigin: "0% 30%", duration: .82, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 1.64)) }, t0 + .1));

    /* 主角动作：按镜头设计 */
    if (role !== "general") return;
    if (shot.id === "r001") {
      [[1.02], [3.06]].forEach(([tt]) => {
        tl.to(w, { x: -12, duration: .24, ease: "power2.in" }, t0 + tt)
          .to(w, { x: 30, duration: .14, ease: "power4.out" }, t0 + tt + .24)
          .to(w, { x: 0, duration: .82, ease: "power2.inOut" }, t0 + tt + .38);
        tl.fromTo("#stage", { x: 0 }, { x: 7, duration: .05, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt + .27);
      });
    } else if (shot.id === "r002") {
      [.9, 2.7].forEach((tt) => {
        tl.fromTo(w, { scale: 1 }, { scale: 1.035, duration: .2, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt);
      });
    } else if (shot.id === "r003") {
      tl.fromTo(w, { y: 0, rotation: 0 }, { y: -6, rotation: -1.2, duration: 1.5, ease: "sine.out" }, t0 + .5);
      tl.to(w, { y: 0, rotation: 0, duration: 2.6, ease: "sine.inOut" }, t0 + 2.2);
    } else if (shot.id === "r004") {
      tl.to(w, { x: -9, duration: 1.25, ease: "sine.out" }, t0 + .35);
      tl.to(w, { x: 12, duration: .1, ease: "power4.out" }, t0 + 1.68);
      tl.to(w, { x: 0, duration: .95, ease: "power2.out" }, t0 + 1.78);
      tl.fromTo("#stage", { x: 0 }, { x: 9, duration: .055, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + 1.7);
    } else if (shot.id === "r005") {
      [1.15, 3.45].forEach((tt) => {
        tl.to(w, { x: 9, duration: .07, ease: "power3.out" }, t0 + tt)
          .to(w, { x: 0, duration: .55, ease: "power2.out" }, t0 + tt + .07);
        tl.fromTo("#stage", { x: 0 }, { x: 10, duration: .06, yoyo: true, repeat: 1, ease: "power2.out" }, t0 + tt);
      });
    }
  });
}

/* 环境：云、雾、鸟、旗、芦苇、马队、船、军阵、火/烟/雪/尘 */
function animateEnvironment(el, shot, t0, dur) {
  el.querySelectorAll(".pc-cloud").forEach((c, k) => {
    tl.fromTo(c, { x: -10 - (k % 3) * 12 }, { x: 16 + (k % 3) * 14, duration: dur * 1.08, ease: "sine.inOut" }, t0);
  });
  el.querySelectorAll(".pc-mist").forEach((m, k) => {
    tl.fromTo(m, { x: -34, opacity: .5 }, { x: 40, opacity: .82, duration: dur, ease: "sine.inOut" }, t0 + k * .12);
  });
  el.querySelectorAll(".pc-birds").forEach((b, k) => {
    tl.fromTo(b, { x: -46, y: 10 }, { x: 78, y: -14, duration: dur, ease: "sine.inOut" }, t0 + k * .22);
  });
  el.querySelectorAll(".pc-banner").forEach((b, k) => {
    const d = 2.1 + (k % 3) * .3;
    tl.fromTo(b, { rotation: -1.3 }, { rotation: 1.3, transformOrigin: "50% 100%", duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.round(dur / d)) }, t0 + (k % 4) * .18);
  });
  el.querySelectorAll(".pc-pennant").forEach((p, k) => {
    const d = 1.9 + (k % 3) * .28;
    tl.fromTo(p, { rotation: -1.1 }, { rotation: 1.1, transformOrigin: "50% 100%", duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.round(dur / d)) }, t0 + (k % 4) * .22);
  });
  el.querySelectorAll(".pc-reeds").forEach((g, k) => {
    const d = 1.7 + (k % 3) * .25;
    tl.fromTo(g, { rotation: -1.2 }, { rotation: 1.2, transformOrigin: "50% 100%", duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.round(dur / d)) }, t0 + (k % 5) * .16);
  });
  el.querySelectorAll(".pc-spears").forEach((s, k) => {
    tl.fromTo(s, { rotation: -.6 }, { rotation: .6, transformOrigin: "50% 100%", duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.round(dur / 2.6)) }, t0 + k * .2);
  });
  el.querySelectorAll(".pc-cavalry").forEach((h, k) => {
    tl.fromTo(h, { y: 0, rotation: -1.2 }, { y: -8, rotation: 1.2, transformOrigin: "50% 100%", duration: .19, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / .38)) }, t0 + k * .05);
    tl.fromTo(h, { x: -12 }, { x: 14, duration: dur, ease: "sine.inOut" }, t0);
  });
  el.querySelectorAll(".pc-junk, .pc-warship").forEach((b, k) => {
    const d = 1.5 + k * .3;
    tl.fromTo(b, { y: 0, rotation: -.7 }, { y: -6, rotation: .7, transformOrigin: "50% 92%", duration: d, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.round(dur / (d * 2))) }, t0 + k * .3);
  });
  el.querySelectorAll(".pc-army, .pc-crowd").forEach((a, k) => {
    tl.fromTo(a, { y: 0 }, { y: -2.5, duration: .95, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 1.9)) }, t0 + k * .15);
  });
  el.querySelectorAll(".pc-fire").forEach((f, k) => {
    tl.fromTo(f, { scaleY: .9, y: 3 }, { scaleY: 1.09, y: -5, duration: .46 + (k % 3) * .07, ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.ceil(dur / .5)) }, t0 + (k % 3) * .06);
  });
  el.querySelectorAll(".pc-smoke").forEach((s, k) => {
    tl.fromTo(s, { x: -10 - k * 3, opacity: .5 }, { x: 20 + k * 4, opacity: .86, duration: dur, ease: "sine.inOut" }, t0 + k * .1);
  });
  el.querySelectorAll(".pc-snow").forEach((s) => {
    tl.fromTo(s, { y: -32, x: -8 }, { y: 30, x: 10, duration: dur, ease: "none" }, t0);
  });
  el.querySelectorAll(".pc-rain").forEach((r) => {
    tl.fromTo(r, { y: -40 }, { y: 40, duration: dur, ease: "none" }, t0);
  });
  el.querySelectorAll(".pc-embers").forEach((m, k) => {
    tl.fromTo(m, { y: 28, opacity: .5 }, { y: -42, opacity: .95, duration: dur, ease: "sine.out" }, t0 + (k % 3) * .12);
  });
  el.querySelectorAll(".pc-dust").forEach((m, k) => {
    tl.fromTo(m, { x: -30, opacity: .24 }, { x: 34, opacity: .5, duration: dur, ease: "sine.inOut" }, t0 + k * .1);
  });
  el.querySelectorAll(".pc-stars").forEach((m) => {
    tl.fromTo(m, { opacity: .38 }, { opacity: .92, duration: Math.max(.7, dur / 2), ease: "sine.inOut", yoyo: true, repeat: Math.max(2, 2 * Math.floor(dur / 2)) }, t0);
  });
  /* 炮口闪光：让开炮发生在运镜落定之后 */
  el.querySelectorAll(".pc-muzzle").forEach((m) => {
    [1.15, 3.45].forEach((tt) => {
      tl.fromTo(m, { scale: .18, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, duration: .11, ease: "power4.out" }, t0 + tt);
      tl.to(m, { scale: 1.8, opacity: 0, duration: .52, ease: "power2.out" }, t0 + tt + .13);
    });
  });
}

/* 开场钩子：标题砸屏后 1 秒抖屏，振幅按 1.6 次方衰减到 0 */
function hookShake(el, t0, dur, amp) {
  const n = Math.round(dur * 30);
  for (let k = 0; k <= n; k++) {
    const tt = k / 30;
    const env = Math.pow(1 - tt / dur, 1.6);
    const dx = Math.sin(tt * 11 * 2 * Math.PI) * amp * env;
    const dy = Math.sin(tt * 7.3 * 2 * Math.PI) * amp * .6 * env;
    tl.set(el, { x: dx, y: dy }, t0 + tt);
  }
}

function buildTimeline() {
  const rootDur = parseFloat(document.getElementById("root").dataset.duration) || 0;
  const total = Math.max(CUE.filmEnd || 0, rootDur, SHOTS.length ? SHOTS[SHOTS.length - 1].t1 + 5.4 : 5.4);
  tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

  gsap.set(".shot", { autoAlpha: 0 });

  SHOTS.forEach((shot, i) => {
    const el = document.querySelectorAll("#stage .shot")[i];
    if (!el) return;
    const t0 = Number(shot.t0) || 0;
    const t1 = Number(shot.t1) || t0 + 3.5;
    const dur = Math.max(0.4, t1 - t0);
    const world = el.querySelector(".shot-world");
    const cam = cameraOf(shot);
    const ease = shot.camera && shot.camera.ease ? shot.camera.ease : "sine.inOut";
    const hook = !!shot.hook;

    tl.set(el, { autoAlpha: 1 }, t0);

    /* 运镜：两段式（推进 → 收束），缩放走对数空间，速度变化不顿挫 */
    const cf = cam.from, ct = cam.to;
    const cs = (a, b, r) => Math.exp(Math.log(a) * (1 - r) + Math.log(b) * r);
    const mid = {
      x: (cf.x || 0) + ((ct.x || 0) - (cf.x || 0)) * .58,
      y: (cf.y || 0) + ((ct.y || 0) - (cf.y || 0)) * .58,
      scale: cs(cf.scale || 1.02, ct.scale || 1.10, .58),
      rotation: (cf.rot || 0) + ((ct.rot || 0) - (cf.rot || 0)) * .58
    };
    tl.fromTo(world,
      { x: cf.x || 0, y: cf.y || 0, scale: cf.scale || 1.02, rotation: cf.rot || 0 },
      { x: mid.x, y: mid.y, scale: mid.scale, rotation: mid.rotation, duration: dur * .58, ease: "power1.inOut" }, t0);
    tl.to(world,
      { x: ct.x || 0, y: ct.y || 0, scale: ct.scale || 1.10, rotation: ct.rot || 0, duration: dur * .42, ease },
      t0 + dur * .58);

    if (hook) {
      /* 钩子：各层从下方砸入，落定后抖屏 1 秒 */
      [
        [".pc-sky", -22, 1.05, 0],
        [".pc-far", 26, 1.04, .02],
        [".pc-mid", 64, 1.10, .04],
        [".pc-action", 96, 1.14, .06],
        [".pc-fore", 26, 1.04, .08]
      ].forEach(([sel, y0, s0, delay]) => {
        const layer = el.querySelector(sel);
        if (!layer) return;
        tl.fromTo(layer, { x: 0, y: y0, scale: s0, transformOrigin: "50% 82%" },
          { x: 0, y: 0, scale: 1, duration: .52, ease: "power4.out" }, t0 + delay);
      });
      hookShake(el, t0, 1.0, 14);
      tl.fromTo("#hook-flash", { opacity: 0 }, { opacity: .95, duration: .04, ease: "none" }, t0);
      tl.to("#hook-flash", { opacity: 0, duration: .32, ease: "power2.out" }, t0 + .05);
      tl.fromTo("#hook-ring", { opacity: 0, scale: .32 }, { opacity: .85, scale: 1, duration: .16, ease: "power4.out" }, t0 + .03);
      tl.to("#hook-ring", { opacity: 0, scale: 1.55, duration: .44, ease: "power2.out" }, t0 + .20);
    } else {
      /* 手持浮动：整镜极轻微漂移，去掉三脚架感 */
      const hs = i % 2 ? 1 : -1;
      tl.fromTo(el, { x: 0, y: 0 }, { x: hs * 5, y: -3 - (i % 3), duration: dur, ease: "sine.inOut" }, t0);

      /* 层间视差：远景慢、近景快 */
      el.querySelectorAll(".pc-layer").forEach((layer, j) => {
        const depth = parseFloat(layer.dataset.depth || "1");
        const drift = (j % 2 ? 1 : -1) * (12 + depth * 22);
        tl.fromTo(layer, { x: -drift * .55, y: -6 }, { x: drift, y: 9, duration: dur, ease: "sine.inOut" }, t0);
      });
    }

    animateLife(el, shot, t0, dur);
    animateEnvironment(el, shot, t0, dur);

    /* 标题 */
    const title = el.querySelector(".shot-title");
    if (title) {
      if (hook) {
        tl.set(title, { xPercent: -50 }, t0);
        tl.fromTo(title, { opacity: 0, y: 62, scale: 1.52 },
          { opacity: 1, y: 0, scale: 1, duration: .27, ease: "power4.out" }, t0 + .02);
        tl.fromTo(title, { scale: 1 }, { scale: 1.032, duration: .42, ease: "power2.out" }, t0 + .30);
        tl.to(title, { scale: 1, duration: .55, ease: "sine.inOut" }, t0 + .72);
        const kick = title.querySelector(".tc-kicker");
        const sub = title.querySelector(".tc-sub");
        if (kick) {
          tl.set(kick, { opacity: 0 }, t0);
          tl.fromTo(kick, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .32, ease: "power3.out" }, t0 + .20);
        }
        if (sub) {
          tl.set(sub, { opacity: 0 }, t0);
          tl.fromTo(sub, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .36, ease: "power3.out" }, t0 + .36);
        }
        tl.to(title, { opacity: 0, y: -26, duration: .38, ease: "power2.in" }, Math.max(t0 + .5, t1 - .46));
      } else {
        tl.fromTo(title, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, t0 + .12);
        tl.to(title, { opacity: 0, y: -18, duration: .38, ease: "power2.in" }, Math.max(t0 + .5, t1 - .48));
      }
    }

    /* 纸片转场：章节切换或显式声明 */
    if (shot.wipe) {
      tl.set("#paper-wipe", { visibility: "visible" }, Math.max(0, t0 - .22));
      tl.fromTo("#paper-wipe", { xPercent: -105 }, { xPercent: 105, duration: .44, ease: "power2.inOut" }, Math.max(0, t0 - .22));
      tl.set("#paper-wipe", { visibility: "hidden" }, t0 + .24);
    }

    tl.set(el, { autoAlpha: 0 }, t1);
  });

  /* 字幕 */
  CAPS.forEach((s, i) => {
    const el = document.getElementById("cap-" + i);
    if (!el) return;
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .01, ease: "none" }, s.t);
    tl.to(el, { opacity: 0, duration: .01, ease: "none" }, Math.max(s.t + .12, s.end - .04));
  });

  /* 光扫 */
  tl.fromTo("#light-sweep", { xPercent: -22, opacity: .18 }, { xPercent: 22, opacity: .42, duration: 7, ease: "sine.inOut", yoyo: true, repeat: Math.ceil(total / 7) }, 0);

  /* 片尾 */
  const endAt = total - 5.4;
  if (endAt > 0) {
    tl.to("#stage, #caption-wrap, #subtitle-veil, #vignette", { opacity: 0, duration: .7 }, endAt);
    tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.inOut" }, endAt + .15);
    tl.fromTo(".ec-seal", { opacity: 0, scale: 1.3, rotation: -16 }, { opacity: 1, scale: 1, rotation: -6, duration: .6, ease: "back.out(2)" }, endAt + .35);
    tl.fromTo(".ec-kicker, .ec-title, .ec-sub, .ec-next, .ec-brand", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .65, stagger: .14 }, endAt + .55);
  }

  window.__timelines["china-emperors-20min"] = tl;
}

buildStage();
buildCaptions();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(buildTimeline).catch(buildTimeline);
} else {
  buildTimeline();
}
  </script>
</body>
</html>
